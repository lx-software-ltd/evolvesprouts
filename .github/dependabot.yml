# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # GitHub Actions - keep CI secure and up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      exclude:
        - "lx-software-ltd/actions/*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "lx-software-ltd/actions/*"
      actions-pin:
        patterns:
          - "lx-software-ltd/actions/*"

  # NPM - CDK infrastructure
  - package-ecosystem: "npm"
    directory: "/backend/infrastructure"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "infrastructure"
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
          - "constructs"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates - review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # aws-cdk-lib currently pins yaml@1.10.2 transitively; the 1.x patched
      # version (>=1.10.3) is not resolvable in Dependabot security jobs yet.
      - dependency-name: "yaml"
      # Do not ignore minimatch. A security-only job whose only target is an
      # ignored package fails as all_versions_ignored. aws-cdk-lib bundles
      # minimatch 10.2.6 (inBundle, so overrides cannot replace it) and that
      # security job fails as security_update_not_possible. The postinstall
      # script copies minimatch 11.0.4 over the bundle and records that version
      # in the lockfile, which is what Dependabot reads.

  # Python - Lambda backend
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "aws*"
      database:
        patterns:
          - "sqlalchemy*"
          - "alembic"
          - "psycopg*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "boto3"
          - "botocore"
          - "aws*"
          - "sqlalchemy*"
          - "alembic"
          - "psycopg*"
        update-types:
          - "minor"
          - "patch"

  # Pub - Flutter mobile app
  - package-ecosystem: "pub"
    directory: "/apps/evolvesprouts_app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "mobile"
    groups:
      flutter:
        patterns:
          - "flutter*"
          - "cupertino*"
      firebase:
        patterns:
          - "firebase*"
          - "cloud_firestore"
      amplify:
        patterns:
          - "amplify*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "flutter*"
          - "firebase*"
          - "amplify*"
        update-types:
          - "minor"
          - "patch"

  # NPM - Admin web app
  - package-ecosystem: "npm"
    directory: "/apps/admin_web"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "web"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7.0 drops the compiler API used by openapi-typescript, and
      # typescript-eslint still peers typescript <6.1.0. Keep majors ignored
      # until both support TS 7 (see PRs #1876 / #1877).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # GHSA-gcqx-w48m-w2h4 covers deepmerge 4.2.0 through 4.3.1 and has no
      # patched release (CVE-2026-93753 was rejected). @svgr/plugin-svgo
      # declares it and does not call it. The override pins 4.1.2, outside the
      # affected range. Ignore 4.2+ so a version update does not move back in.
      - dependency-name: "deepmerge"
        versions: [">= 4.2.0"]

  # NPM - Public website app
  - package-ecosystem: "npm"
    directory: "/apps/public_www"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "web"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7.0 drops the compiler API used by openapi-typescript, and
      # typescript-eslint still peers typescript <6.1.0. Keep majors ignored
      # until both support TS 7 (see PRs #1876 / #1877).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # NPM - Training site
  # Listed explicitly so security updates are not auto-grouped. An ungrouped
  # "no update possible" result finishes green; the default group records
  # security_update_not_possible and fails the job.
  - package-ecosystem: "npm"
    directory: "/apps/training"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "web"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
