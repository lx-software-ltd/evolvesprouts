name: Debug Secret

on:
  workflow_dispatch:

jobs:
  print-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Print masked secret (Standard)
        env:
          MY_SECRET: ${{ secrets.CDK_PARAM_META_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Standard output: $MY_SECRET"

      - name: Print unmasked secret (For debugging only)
        env:
          MY_SECRET: ${{ secrets.CDK_PARAM_META_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Unmasked output: $(echo "$MY_SECRET" | sed 's/./& /g')"
