name: Deploy Training Web

on:
  repository_dispatch:
    types: [deploy-training]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/training/**"
      - "scripts/deploy/resolve-public-www-build-env.sh"
      - ".github/workflows/deploy-training.yml"

permissions:
  contents: read

concurrency:
  group: deploy-training
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config from infrastructure params
        id: resolve_training_site_env
        env:
          REQUIRE_ASSET: "false"
          REQUIRE_TRAINING: "true"
        run: bash scripts/deploy/resolve-public-www-build-env.sh

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          cache: npm
          working-directory: apps/training

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/training/.next/cache
          key: ${{ runner.os }}-nextjs-training-${{ hashFiles('apps/training/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-training-

      - name: Build training web
        run: npm run build
        working-directory: apps/training
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_training_site_env.outputs.training_site_origin }}
          NEXT_PUBLIC_PUBLIC_WWW_ORIGIN: ${{ steps.resolve_training_site_env.outputs.production_site_origin }}
          # Polls call same-origin /api/* via Training CloudFront (not execute-api /prod).
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_TRAINING_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Deploy training web
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          source: apps/training/out
          stack: evolvesprouts-training
          region: ${{ vars.AWS_REGION }}
          bucket-output: TrainingBucketName
          distribution-output: TrainingDistributionId
          profile: next-export
          dry-run: "false"
