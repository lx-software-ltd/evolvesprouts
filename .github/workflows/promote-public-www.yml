name: Promote Public Website Release

on:
  repository_dispatch:
    types: [promote-public-www]
  workflow_dispatch:
    inputs:
      promotion_mode:
        description: 'Operation mode'
        required: true
        default: 'latest_staging'
        type: choice
        options:
# template:set
          - latest_staging
          - release_id
          - maintenance_on
# template:end
      release_id:
        description: 'Required when promotion_mode=release_id'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-public-www
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    outputs:
      deploy: ${{ steps.catalogue_changes.outputs.deploy || steps.resolve_release.outputs.deploy }}
      maintenance_mode: ${{ steps.resolve_release.outputs.maintenance_mode }}
      skip: ${{ steps.resolve_release.outputs.skip }}
      build_sha: ${{ steps.resolve_release.outputs.build_sha }}
      release_id: ${{ steps.resolve_release.outputs.release_id }}
      promotion_mode: ${{ steps.resolve_release.outputs.promotion_mode }}
      production_site_origin: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
      asset_share_base_url: ${{ steps.resolve_public_site_config.outputs.asset_share_base_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh
        env:
          PROMOTION_MODE: ${{ github.event.inputs.promotion_mode }}

      - name: Validate AWS configuration
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ] || [ -z "$AWS_REGION" ]; then
            echo 'Set AWS_ACCOUNT_ID as a repository secret and AWS_REGION as a variable'
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Decide whether to read the staging bucket
        id: bucket_read
        env:
          PROMOTION_MODE: ${{ github.event.inputs.promotion_mode }}
        run: bash scripts/deploy/resolve-release-id.sh bucket-read

      - name: Read staging bucket
        id: staging
        if: ${{ steps.bucket_read.outputs.read_staging_bucket == 'true' }}
        uses: lx-software-ltd/actions/cfn-stack-outputs@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
# template:set
          stack: evolvesprouts-public-www
# template:end
          outputs: PublicWwwStagingBucketName
          region: ${{ vars.AWS_REGION }}

      - name: Resolve release ID
        id: resolve_release
        env:
          PROMOTION_MODE: ${{ github.event.inputs.promotion_mode }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          STACK_JSON: ${{ steps.staging.outputs.json }}
        run: bash scripts/deploy/resolve-release-id.sh


  promote:
    permissions:
      contents: read
      id-token: write
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && (needs.prepare.result == 'success') }}
    runs-on: ubuntu-26.04
    environment: production
    steps:
      # The summary script is in the repository, including when the release is skipped.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # template:set
          ref: ${{ needs.prepare.outputs.build_sha || github.sha }}
          lfs: false
          # template:end


      - name: Set up Node.js
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        uses: lx-software-ltd/actions/setup-node@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run pre-build checks
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        run: bash scripts/deploy/public-www-checks.sh pre-build
        # template:set
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ needs.prepare.outputs.production_site_origin }}
        # template:end

      - name: Build public website for production
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        run: npm run build
        working-directory: apps/public_www
        # template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ needs.prepare.outputs.production_site_origin }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          NEXT_PUBLIC_BANK_NAME: ${{ vars.NEXT_PUBLIC_BANK_NAME }}
          NEXT_PUBLIC_BANK_ACCOUNT_HOLDER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_HOLDER }}
          NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_NUMBER }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_WWW_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ASSET_SHARE_BASE_URL: ${{ needs.prepare.outputs.asset_share_base_url }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_FOUNDER_NAME: ${{ vars.NEXT_PUBLIC_FOUNDER_NAME }}
        # template:end

      - name: Run post-build checks
        if: ${{ success() && needs.prepare.outputs.deploy == 'true' }}
        run: bash scripts/deploy/public-www-checks.sh post-build
        # template:set
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
        # template:end


      - name: Configure AWS credentials
        if: ${{ success() && (needs.prepare.outputs.maintenance_mode == 'true' || needs.prepare.outputs.deploy == 'true') }}
        uses: lx-software-ltd/actions/aws-oidc@b911ce02864881b95506a008a471108db22ce29e # main 2026-11-27
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Promote release or enable maintenance mode
        if: ${{ success() && (needs.prepare.outputs.maintenance_mode == 'true' || needs.prepare.outputs.deploy == 'true') }}
        run: bash scripts/deploy/deploy-public-www.sh
        # template:set
        env:
          PUBLIC_WWW_STACK_NAME: evolvesprouts-public-www
          PUBLIC_WWW_ENVIRONMENT: production
          PUBLIC_WWW_MAINTENANCE_MODE: ${{ needs.prepare.outputs.maintenance_mode }}
          PUBLIC_WWW_PROMOTE_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PUBLIC_WWW_PROMOTION_BUILD_DIR: ${{ needs.prepare.outputs.maintenance_mode != 'true' && format('{0}/apps/public_www/out', github.workspace) || '' }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
        # template:end



      - name: Publish promotion summary
        run: bash scripts/deploy/publish-promotion-summary.sh
        # template:set
        env:
          PROMOTION_MODE: ${{ needs.prepare.outputs.promotion_mode }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          PRODUCTION_SITE_ORIGIN: ${{ needs.prepare.outputs.production_site_origin }}
        # template:end
