name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      cdk_stacks:
        description: 'CDK stacks to deploy'
        required: false
        default: 'all stacks'
        type: choice
        options:
          - 'all stacks'
          - 'backend'
          - 'admin web'
          - 'public website'
      run_seed_data:
        description: 'Run seed data after migrations (backend stack only)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'apps/public_www/src/content/landing-pages/**'
      - 'apps/public_www/src/content/eventbrite-banners/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          cache: npm
          working-directory: backend/infrastructure
          install: "false"

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: backend/infrastructure
        run: npm ci

      - name: Check CDK bootstrap
        uses: lx-software-ltd/actions/cdk-bootstrap-check@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Check CDK parameters
        id: prep
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          npm run build --if-present

          if [ "${CDK_STACKS:-}" = "all stacks" ]; then
            CDK_STACKS="evolvesprouts evolvesprouts-admin-web evolvesprouts-public-www evolvesprouts-training"
          elif [ "${CDK_STACKS:-}" = "backend" ]; then
            CDK_STACKS="evolvesprouts"
          elif [ "${CDK_STACKS:-}" = "admin web" ]; then
            CDK_STACKS="evolvesprouts-admin-web"
          elif [ "${CDK_STACKS:-}" = "public website" ] || [ "${CDK_STACKS:-}" = "public www" ] || [ "${CDK_STACKS:-}" = "public website staging" ] || [ "${CDK_STACKS:-}" = "public www staging" ]; then
            CDK_STACKS="evolvesprouts-public-www"
          elif [ "${CDK_STACKS:-}" = "training" ] || [ "${CDK_STACKS:-}" = "training web" ]; then
            CDK_STACKS="evolvesprouts-training"
          fi

          PARAM_ARGS=()

          resolve_param_file() {
            local path="$1"
            if [ -z "$path" ]; then
              return 1
            fi
            if [ -f "$path" ]; then
              echo "$path"
              return 0
            fi
            if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "$GITHUB_WORKSPACE/$path"
              return 0
            fi
            return 1
          }

          if [ -n "${CDK_PARAM_FILE:-}" ]; then
            RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
            if [ -z "$RESOLVED_PARAM_FILE" ]; then
              echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
              exit 1
            fi
            PARAM_ARGS_FILE="$(mktemp)"
            PARAM_FILE="$RESOLVED_PARAM_FILE" STACKS="$CDK_STACKS" python3 - <<'PY' > "$PARAM_ARGS_FILE"
          import json
          import os
          import sys
          from zoneinfo import ZoneInfo, ZoneInfoNotFoundError

          with open(os.environ["PARAM_FILE"], "r", encoding="utf-8") as handle:
              params = json.load(handle)

          stack_set = set(os.environ.get("STACKS", "").split())
          backend_stack = "evolvesprouts"
          admin_web_stack = "evolvesprouts-admin-web"
          public_stack = "evolvesprouts-public-www"
          training_stack = "evolvesprouts-training"
          admin_web_params = {"AdminWebDomainName", "AdminWebCertificateArn", "WafWebAclArn"}
          public_params = {
              "PublicWwwDomainName",
              "PublicWwwCertificateArn",
              "PublicWwwStagingDomainName",
              "PublicWwwStagingCertificateArn",
              "PublicWwwApiBaseUrl",
              "PublicWwwMediaRequestApiBaseUrl",
              "PublicWwwEdgeVerifySecret",
              "PublicWwwEdgeVerifySecretPrevious",
              "PublicWwwStagingEdgeVerifySecret",
              "PublicWwwStagingEdgeVerifySecretPrevious",
              "WafWebAclArn",
          }
          # Omitted parameters keep their previous stack value. Edge-verify
          # keys are passed even when empty so clearing the GitHub secret
          # disables the origin lock. Siutindei omits them, and an empty
          # deploy there cannot turn the lock off.
          pass_empty_params = {
              "WafWebAclArn",
              "PublicWwwEdgeVerifySecret",
              "PublicWwwEdgeVerifySecretPrevious",
              "PublicWwwStagingEdgeVerifySecret",
              "PublicWwwStagingEdgeVerifySecretPrevious",
          }
          training_params = {
              "TrainingDomainName",
              "TrainingCertificateArn",
              "TrainingApiBaseUrl",
              "TrainingMediaRequestApiBaseUrl",
              "WafWebAclArn",
          }
          backend_cors_domain_params = {
              "PublicWwwDomainName",
              "PublicWwwStagingDomainName",
              "AdminWebDomainName",
              "TrainingDomainName",
          }

          def resolve_value(raw: str) -> str:
              """Replace <FROM_GITHUB_SECRET: X> / <FROM_GITHUB_VAR: X> placeholders."""
              raw = raw.strip()
              if raw.startswith("<FROM_GITHUB_SECRET:") and raw.endswith(">"):
                  env_name = raw[len("<FROM_GITHUB_SECRET:") : -1].strip()
                  return os.environ.get(env_name, "")
              if raw.startswith("<FROM_GITHUB_VAR:") and raw.endswith(">"):
                  env_name = raw[len("<FROM_GITHUB_VAR:") : -1].strip()
                  return os.environ.get(env_name, "")
              return raw

          iana_timezone_params = {
              "InvoiceDisplayTimezone",
              "EventbriteDefaultTimezone",
              "SalesRecapDisplayTimezone",
          }

          def is_eventbrite_timezone(zone_id: str) -> bool:
              """Match _is_eventbrite_timezone in eventbrite_sync.py."""
              if zone_id != "UTC" and (
                  zone_id.startswith("Etc/") or "/" not in zone_id
              ):
                  return False
              try:
                  ZoneInfo(zone_id)
              except (ZoneInfoNotFoundError, ValueError):
                  return False
              return True

          def require_iana_timezone(key: str, value: str) -> None:
              """Fail a backend deploy when a set timezone is not usable.

              Public website, admin web, and training deploys skip this.
              Those stacks do not receive the timezone parameters, and a
              stale GitHub value must not block them.
              """
              if backend_stack not in stack_set:
                  return
              if key not in iana_timezone_params or not value:
                  return
              if key == "EventbriteDefaultTimezone":
                  if is_eventbrite_timezone(value):
                      return
                  raise SystemExit(
                      f"{key} value {value!r} must be UTC or a Region/City IANA id"
                  )
              try:
                  ZoneInfo(value)
              except (ZoneInfoNotFoundError, ValueError) as exc:
                  raise SystemExit(
                      f"{key} value {value!r} is not a valid IANA timezone"
                  ) from exc

          for key, value in params.items():
              value_str = ""
              if value is not None:
                  value_str = resolve_value(str(value))
              require_iana_timezone(key, value_str)
              if key not in pass_empty_params and not value_str:
                  continue

              targets = []
              if key in admin_web_params:
                  targets.append(admin_web_stack)
              if key in public_params:
                  targets.append(public_stack)
              if key in training_params:
                  targets.append(training_stack)
              if key in backend_cors_domain_params:
                  targets.append(backend_stack)
              if not targets:
                  targets.append(backend_stack)

              for target in targets:
                  if target not in stack_set:
                      continue
                  # Emit NUL-delimited tokens so multiline values (e.g. PEM keys)
                  # are preserved as single CLI arguments.
                  sys.stdout.buffer.write(b"--parameters\0")
                  sys.stdout.buffer.write(
                      f"{target}:{key}={value_str}".encode("utf-8") + b"\0"
                  )
          PY
            rm -f "$PARAM_ARGS_FILE"
          fi

          EDGE_VERIFY_BEFORE_STAGING="skipped"
          EDGE_VERIFY_BEFORE_PRODUCTION="skipped"
          if [[ " $CDK_STACKS " == *" evolvesprouts-public-www "* ]]; then
            read_one() {
              local key="$1" value
              value="$(aws cloudformation describe-stacks --stack-name evolvesprouts-public-www --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='${key}'].OutputValue | [0]" --output text 2>/dev/null || true)"
              if [ -z "$value" ] || [ "$value" = "None" ]; then
                echo absent
              else
                printf '%s\n' "$value"
              fi
            }
            EDGE_VERIFY_BEFORE_STAGING="$(read_one PublicWwwStagingEdgeVerifyEnabled)"
            EDGE_VERIFY_BEFORE_PRODUCTION="$(read_one PublicWwwEdgeVerifyEnabled)"
          fi
          echo "staging_before=$EDGE_VERIFY_BEFORE_STAGING" >> "$GITHUB_OUTPUT"
          echo "production_before=$EDGE_VERIFY_BEFORE_PRODUCTION" >> "$GITHUB_OUTPUT"
          echo "stacks=$CDK_STACKS" >> "$GITHUB_OUTPUT"
          CDK_BOOTSTRAP_QUALIFIER="$CDK_BOOTSTRAP_QUALIFIER" python3 - << 'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("cdk-plan.json").read_text(encoding="utf-8"))
          qualifier = os.environ.get("CDK_BOOTSTRAP_QUALIFIER", "")
          if qualifier:
              plan["groups"][0]["extra-args"] = ["--qualifier", qualifier]
          destination = Path(os.environ["RUNNER_TEMP"]) / "cdk-plan.json"
          destination.write_text(json.dumps(plan) + "\n", encoding="utf-8")
          PY
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          RUN_SEED_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed_data || 'false' }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          CDK_PARAM_GOOGLE_CLIENT_SECRET: ${{ secrets.CDK_PARAM_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN }}
          CDK_PARAM_TRAINING_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_TRAINING_CERTIFICATE_ARN }}
          CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ASSET_DOWNLOAD_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_API_KEY_VALUE: ${{ secrets.CDK_PARAM_PUBLIC_API_KEY_VALUE }}
          CDK_PARAM_TURNSTILE_SECRET_KEY: ${{ secrets.CDK_PARAM_TURNSTILE_SECRET_KEY }}
          CDK_PARAM_STRIPE_SECRET_KEY: ${{ secrets.CDK_PARAM_STRIPE_SECRET_KEY }}
          CDK_PARAM_STAGING_STRIPE_SECRET_KEY: ${{ secrets.CDK_PARAM_STAGING_STRIPE_SECRET_KEY }}
          CDK_PARAM_MAILCHIMP_API_SECRET_ARN: ${{ secrets.CDK_PARAM_MAILCHIMP_API_SECRET_ARN }}
          CDK_PARAM_MAILCHIMP_LIST_ID: ${{ vars.CDK_PARAM_MAILCHIMP_LIST_ID }}
          CDK_PARAM_MAILCHIMP_SERVER_PREFIX: ${{ vars.CDK_PARAM_MAILCHIMP_SERVER_PREFIX }}
          CDK_PARAM_MAILCHIMP_WEBHOOK_SECRET: ${{ secrets.CDK_PARAM_MAILCHIMP_WEBHOOK_SECRET }}
          CDK_PARAM_META_APP_SECRET: ${{ secrets.CDK_PARAM_META_APP_SECRET }}
          CDK_PARAM_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.CDK_PARAM_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          CDK_PARAM_META_PAGE_ACCESS_TOKEN: ${{ secrets.CDK_PARAM_META_PAGE_ACCESS_TOKEN }}
          CDK_PARAM_META_PAGE_ID: ${{ vars.CDK_PARAM_META_PAGE_ID }}
          CDK_PARAM_META_INSTAGRAM_USER_ID: ${{ vars.CDK_PARAM_META_INSTAGRAM_USER_ID }}
          CDK_PARAM_META_APP_ID: ${{ vars.CDK_PARAM_META_APP_ID }}
          CDK_PARAM_META_GRAPH_API_BASE_URL: ${{ vars.CDK_PARAM_META_GRAPH_API_BASE_URL }}
          CDK_PARAM_META_GRAPH_API_VERSION: ${{ vars.CDK_PARAM_META_GRAPH_API_VERSION }}
          CDK_PARAM_WHATSAPP_EXPORT_BUSINESS_NAMES: ${{ vars.CDK_PARAM_WHATSAPP_EXPORT_BUSINESS_NAMES }}
          CDK_PARAM_MAILCHIMP_MEDIA_DOWNLOAD_MERGE_TAG: ${{ vars.CDK_PARAM_MAILCHIMP_MEDIA_DOWNLOAD_MERGE_TAG }}
          CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_ID: ${{ vars.CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_ID }}
          CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_STEP_ID: ${{ vars.CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_STEP_ID }}
          CDK_PARAM_EVENTBRITE_TOKEN_SECRET_ARN: ${{ secrets.CDK_PARAM_EVENTBRITE_TOKEN_SECRET_ARN }}
          CDK_PARAM_EVENTBRITE_ORGANIZATION_ID: ${{ vars.CDK_PARAM_EVENTBRITE_ORGANIZATION_ID }}
          CDK_PARAM_EVENTBRITE_DEFAULT_TIMEZONE: ${{ vars.CDK_PARAM_EVENTBRITE_DEFAULT_TIMEZONE }}
          CDK_PARAM_MEDIA_DEFAULT_RESOURCE_KEY: ${{ vars.CDK_PARAM_MEDIA_DEFAULT_RESOURCE_KEY }}
          CDK_PARAM_SALES_RECAP_DISPLAY_TIMEZONE: ${{ vars.CDK_PARAM_SALES_RECAP_DISPLAY_TIMEZONE }}
          CDK_PARAM_OPENROUTER_API_KEY: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY }}
          CDK_PARAM_OPENROUTER_CHAT_COMPLETIONS_URL: ${{ vars.CDK_PARAM_OPENROUTER_CHAT_COMPLETIONS_URL }}
          CDK_PARAM_OPENROUTER_MODEL: ${{ vars.CDK_PARAM_OPENROUTER_MODEL }}
          # Production-environment job. A secret that exists only in the
          # staging environment is invisible here. An empty value omits the
          # parameter and CloudFormation keeps the previous allowlist.
          CDK_PARAM_INBOUND_INVOICE_ALLOWED_SENDER_PATTERNS: ${{ secrets.CDK_PARAM_INBOUND_INVOICE_ALLOWED_SENDER_PATTERNS }}
          STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
          CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD: ${{ secrets.CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD }}
          CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PUBLIC_KEY_PEM: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PUBLIC_KEY_PEM }}
          CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_SECRET_ARN }}
          CDK_PARAM_CERTIFICATE_ES_FOUNDER_NAME: ${{ vars.CDK_PARAM_CERTIFICATE_ES_FOUNDER_NAME }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          PUBLIC_WWW_API_BASE_URL: ${{ vars.PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          PUBLIC_WWW_MEDIA_REQUEST_API_BASE_URL: ${{ vars.PUBLIC_WWW_MEDIA_REQUEST_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_BUSINESS_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_NAME }}
          NEXT_PUBLIC_BUSINESS_LEGAL_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_LEGAL_NAME }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_BILLING_EMAIL: ${{ vars.NEXT_PUBLIC_BILLING_EMAIL }}
          NEXT_PUBLIC_BUSINESS_REGISTRATION: ${{ vars.NEXT_PUBLIC_BUSINESS_REGISTRATION }}
          NEXT_PUBLIC_BANK_NAME: ${{ vars.NEXT_PUBLIC_BANK_NAME }}
          NEXT_PUBLIC_BANK_ACCOUNT_HOLDER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_HOLDER }}
          NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_NUMBER }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          CDK_PARAM_INVOICE_DISPLAY_TIMEZONE: ${{ vars.CDK_PARAM_INVOICE_DISPLAY_TIMEZONE }}
          CDK_PARAM_INVOICE_PAYMENT_TERMS_DAYS: ${{ vars.CDK_PARAM_INVOICE_PAYMENT_TERMS_DAYS }}
          # This job uses the production environment. These secrets must be
          # repository secrets or production-environment secrets. A secret
          # that exists only in the staging environment is invisible here,
          # the parameter stays empty, and the origin lock stays off.
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS }}

      - name: Deploy stacks
        uses: lx-software-ltd/actions/cdk-deploy@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          working-directory: backend/infrastructure
          plan-file: ${{ runner.temp }}/cdk-plan.json
          stacks: ${{ steps.prep.outputs.stacks }}
          param-file: ${{ vars.CDK_PARAM_FILE }}
          format: plain-json
          attempts: "3"
          no-notices: "true"
          pass-empty: WafWebAclArn,PublicWwwEdgeVerifySecret,PublicWwwEdgeVerifySecretPrevious,PublicWwwStagingEdgeVerifySecret,PublicWwwStagingEdgeVerifySecretPrevious
          run-seed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed_data || 'false' }}
          region: ${{ vars.AWS_REGION }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          RUN_SEED_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed_data || 'false' }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          CDK_PARAM_GOOGLE_CLIENT_SECRET: ${{ secrets.CDK_PARAM_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_COGNITO_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ADMIN_WEB_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_CERTIFICATE_ARN }}
          CDK_PARAM_TRAINING_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_TRAINING_CERTIFICATE_ARN }}
          CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_API_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_ASSET_DOWNLOAD_CUSTOM_DOMAIN_CERTIFICATE_ARN: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CUSTOM_DOMAIN_CERTIFICATE_ARN }}
          CDK_PARAM_PUBLIC_API_KEY_VALUE: ${{ secrets.CDK_PARAM_PUBLIC_API_KEY_VALUE }}
          CDK_PARAM_TURNSTILE_SECRET_KEY: ${{ secrets.CDK_PARAM_TURNSTILE_SECRET_KEY }}
          CDK_PARAM_STRIPE_SECRET_KEY: ${{ secrets.CDK_PARAM_STRIPE_SECRET_KEY }}
          CDK_PARAM_STAGING_STRIPE_SECRET_KEY: ${{ secrets.CDK_PARAM_STAGING_STRIPE_SECRET_KEY }}
          CDK_PARAM_MAILCHIMP_API_SECRET_ARN: ${{ secrets.CDK_PARAM_MAILCHIMP_API_SECRET_ARN }}
          CDK_PARAM_MAILCHIMP_LIST_ID: ${{ vars.CDK_PARAM_MAILCHIMP_LIST_ID }}
          CDK_PARAM_MAILCHIMP_SERVER_PREFIX: ${{ vars.CDK_PARAM_MAILCHIMP_SERVER_PREFIX }}
          CDK_PARAM_MAILCHIMP_WEBHOOK_SECRET: ${{ secrets.CDK_PARAM_MAILCHIMP_WEBHOOK_SECRET }}
          CDK_PARAM_META_APP_SECRET: ${{ secrets.CDK_PARAM_META_APP_SECRET }}
          CDK_PARAM_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.CDK_PARAM_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          CDK_PARAM_META_PAGE_ACCESS_TOKEN: ${{ secrets.CDK_PARAM_META_PAGE_ACCESS_TOKEN }}
          CDK_PARAM_META_PAGE_ID: ${{ vars.CDK_PARAM_META_PAGE_ID }}
          CDK_PARAM_META_INSTAGRAM_USER_ID: ${{ vars.CDK_PARAM_META_INSTAGRAM_USER_ID }}
          CDK_PARAM_META_APP_ID: ${{ vars.CDK_PARAM_META_APP_ID }}
          CDK_PARAM_META_GRAPH_API_BASE_URL: ${{ vars.CDK_PARAM_META_GRAPH_API_BASE_URL }}
          CDK_PARAM_META_GRAPH_API_VERSION: ${{ vars.CDK_PARAM_META_GRAPH_API_VERSION }}
          CDK_PARAM_WHATSAPP_EXPORT_BUSINESS_NAMES: ${{ vars.CDK_PARAM_WHATSAPP_EXPORT_BUSINESS_NAMES }}
          CDK_PARAM_MAILCHIMP_MEDIA_DOWNLOAD_MERGE_TAG: ${{ vars.CDK_PARAM_MAILCHIMP_MEDIA_DOWNLOAD_MERGE_TAG }}
          CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_ID: ${{ vars.CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_ID }}
          CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_STEP_ID: ${{ vars.CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_STEP_ID }}
          CDK_PARAM_EVENTBRITE_TOKEN_SECRET_ARN: ${{ secrets.CDK_PARAM_EVENTBRITE_TOKEN_SECRET_ARN }}
          CDK_PARAM_EVENTBRITE_ORGANIZATION_ID: ${{ vars.CDK_PARAM_EVENTBRITE_ORGANIZATION_ID }}
          CDK_PARAM_EVENTBRITE_DEFAULT_TIMEZONE: ${{ vars.CDK_PARAM_EVENTBRITE_DEFAULT_TIMEZONE }}
          CDK_PARAM_MEDIA_DEFAULT_RESOURCE_KEY: ${{ vars.CDK_PARAM_MEDIA_DEFAULT_RESOURCE_KEY }}
          CDK_PARAM_SALES_RECAP_DISPLAY_TIMEZONE: ${{ vars.CDK_PARAM_SALES_RECAP_DISPLAY_TIMEZONE }}
          CDK_PARAM_OPENROUTER_API_KEY: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY }}
          CDK_PARAM_OPENROUTER_CHAT_COMPLETIONS_URL: ${{ vars.CDK_PARAM_OPENROUTER_CHAT_COMPLETIONS_URL }}
          CDK_PARAM_OPENROUTER_MODEL: ${{ vars.CDK_PARAM_OPENROUTER_MODEL }}
          # Production-environment job. A secret that exists only in the
          # staging environment is invisible here. An empty value omits the
          # parameter and CloudFormation keeps the previous allowlist.
          CDK_PARAM_INBOUND_INVOICE_ALLOWED_SENDER_PATTERNS: ${{ secrets.CDK_PARAM_INBOUND_INVOICE_ALLOWED_SENDER_PATTERNS }}
          STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
          CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD: ${{ secrets.CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD }}
          CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PUBLIC_KEY_PEM: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PUBLIC_KEY_PEM }}
          CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_SECRET_ARN }}
          CDK_PARAM_CERTIFICATE_ES_FOUNDER_NAME: ${{ vars.CDK_PARAM_CERTIFICATE_ES_FOUNDER_NAME }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          PUBLIC_WWW_API_BASE_URL: ${{ vars.PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          PUBLIC_WWW_MEDIA_REQUEST_API_BASE_URL: ${{ vars.PUBLIC_WWW_MEDIA_REQUEST_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_BUSINESS_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_NAME }}
          NEXT_PUBLIC_BUSINESS_LEGAL_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_LEGAL_NAME }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_BILLING_EMAIL: ${{ vars.NEXT_PUBLIC_BILLING_EMAIL }}
          NEXT_PUBLIC_BUSINESS_REGISTRATION: ${{ vars.NEXT_PUBLIC_BUSINESS_REGISTRATION }}
          NEXT_PUBLIC_BANK_NAME: ${{ vars.NEXT_PUBLIC_BANK_NAME }}
          NEXT_PUBLIC_BANK_ACCOUNT_HOLDER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_HOLDER }}
          NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_NUMBER }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          CDK_PARAM_INVOICE_DISPLAY_TIMEZONE: ${{ vars.CDK_PARAM_INVOICE_DISPLAY_TIMEZONE }}
          CDK_PARAM_INVOICE_PAYMENT_TERMS_DAYS: ${{ vars.CDK_PARAM_INVOICE_PAYMENT_TERMS_DAYS }}
          # This job uses the production environment. These secrets must be
          # repository secrets or production-environment secrets. A secret
          # that exists only in the staging environment is invisible here,
          # the parameter stays empty, and the origin lock stays off.
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_EDGE_VERIFY_PREVIOUS }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY }}
          CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS: ${{ secrets.CDK_PARAM_PUBLIC_WWW_STAGING_EDGE_VERIFY_PREVIOUS }}

      - name: Report public website edge verify
        if: steps.prep.outputs.stacks != '' && contains(steps.prep.outputs.stacks, 'evolvesprouts-public-www')
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          read_one() {
            local key="$1" value
            value="$(aws cloudformation describe-stacks --stack-name evolvesprouts-public-www --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='${key}'].OutputValue | [0]" --output text 2>/dev/null || true)"
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo absent
            else
              printf '%s\n' "$value"
            fi
          }
          bash "${GITHUB_WORKSPACE}/scripts/deploy/report_public_www_edge_verify.sh" \
            "${{ steps.prep.outputs.staging_before }}" \
            "$(read_one PublicWwwStagingEdgeVerifyEnabled)" \
            "${{ steps.prep.outputs.production_before }}" \
            "$(read_one PublicWwwEdgeVerifyEnabled)"
