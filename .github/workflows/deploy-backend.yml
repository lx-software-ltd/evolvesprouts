name: Deploy Backend

on:
  repository_dispatch:
    types: [deploy-backend]
  workflow_dispatch:
    inputs:
      cdk_stacks:
        description: 'CDK stacks to deploy'
        required: false
        default: 'all stacks'
        type: choice
        options:
          - 'all stacks'
          - 'backend'
          - 'admin web'
          - 'public website'
      run_seed_data:
        description: 'Run seed data after migrations (backend stack only)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Determine deployment region
        id: region
        env:
          INPUT_CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          INPUT_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "region=$INPUT_AWS_REGION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ steps.region.outputs.region }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Install CDK dependencies
        working-directory: backend/infrastructure
        run: npm ci

      - name: Bootstrap CDK
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          if [ -n "$CDK_BOOTSTRAP_QUALIFIER" ]; then
            npx cdk bootstrap --no-notices --qualifier "$CDK_BOOTSTRAP_QUALIFIER" "aws://$AWS_ACCOUNT_ID/$AWS_REGION"
          else
            npx cdk bootstrap --no-notices "aws://$AWS_ACCOUNT_ID/$AWS_REGION"
          fi
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ steps.region.outputs.region }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}

      - name: Deploy stacks
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          npm run build --if-present

          if [ "${CDK_STACKS:-}" = "all stacks" ]; then
            CDK_STACKS="evolvesprouts evolvesprouts-admin-web evolvesprouts-public-www evolvesprouts-training"
          elif [ "${CDK_STACKS:-}" = "backend" ]; then
            CDK_STACKS="evolvesprouts"
          elif [ "${CDK_STACKS:-}" = "admin web" ]; then
            CDK_STACKS="evolvesprouts-admin-web"
          elif [ "${CDK_STACKS:-}" = "public website" ] || [ "${CDK_STACKS:-}" = "public www" ] || [ "${CDK_STACKS:-}" = "public website staging" ] || [ "${CDK_STACKS:-}" = "public www staging" ]; then
            CDK_STACKS="evolvesprouts-public-www"
          elif [ "${CDK_STACKS:-}" = "training" ] || [ "${CDK_STACKS:-}" = "training web" ]; then
            CDK_STACKS="evolvesprouts-training"
          fi

          PARAM_ARGS=()

          resolve_param_file() {
            local path="$1"
            if [ -z "$path" ]; then
              return 1
            fi
            if [ -f "$path" ]; then
              echo "$path"
              return 0
            fi
            if [ -n "$GITHUB_WORKSPACE" ] && [ -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "$GITHUB_WORKSPACE/$path"
              return 0
            fi
            return 1
          }

          if [ -n "${CDK_PARAM_FILE:-}" ]; then
            RESOLVED_PARAM_FILE=$(resolve_param_file "$CDK_PARAM_FILE" || true)
            if [ -z "$RESOLVED_PARAM_FILE" ]; then
              echo "CDK_PARAM_FILE '$CDK_PARAM_FILE' not found"
              exit 1
            fi
            PARAM_ARGS_FILE="$(mktemp)"
            PARAM_FILE="$RESOLVED_PARAM_FILE" STACKS="$CDK_STACKS" python3 - <<'PY' > "$PARAM_ARGS_FILE"
          import json
          import os
          import sys

          with open(os.environ["PARAM_FILE"], "r", encoding="utf-8") as handle:
              params = json.load(handle)

          stack_set = set(os.environ.get("STACKS", "").split())
          backend_stack = "evolvesprouts"
          admin_web_stack = "evolvesprouts-admin-web"
          public_stack = "evolvesprouts-public-www"
          training_stack = "evolvesprouts-training"
          admin_web_params = {"AdminWebDomainName", "AdminWebCertificateArn", "WafWebAclArn"}
          public_params = {
              "PublicWwwDomainName",
              "PublicWwwCertificateArn",
              "PublicWwwStagingDomainName",
              "PublicWwwStagingCertificateArn",
              "PublicWwwApiBaseUrl",
              "PublicWwwMediaRequestApiBaseUrl",
              "WafWebAclArn",
          }
          training_params = {
              "TrainingDomainName",
              "TrainingCertificateArn",
              "TrainingApiBaseUrl",
              "TrainingMediaRequestApiBaseUrl",
              "WafWebAclArn",
          }
          backend_cors_domain_params = {
              "PublicWwwDomainName",
              "PublicWwwStagingDomainName",
              "AdminWebDomainName",
              "TrainingDomainName",
          }

          def resolve_value(raw: str) -> str:
              """Replace <FROM_GITHUB_SECRET: X> / <FROM_GITHUB_VAR: X> placeholders."""
              raw = raw.strip()
              if raw.startswith("<FROM_GITHUB_SECRET:") and raw.endswith(">"):
                  env_name = raw[len("<FROM_GITHUB_SECRET:") : -1].strip()
                  return os.environ.get(env_name, "")
              if raw.startswith("<FROM_GITHUB_VAR:") and raw.endswith(">"):
                  env_name = raw[len("<FROM_GITHUB_VAR:") : -1].strip()
                  return os.environ.get(env_name, "")
              return raw

          for key, value in params.items():
              value_str = ""
              if value is not None:
                  value_str = resolve_value(str(value))
              if key != "WafWebAclArn" and not value_str:
                  continue

              targets = []
              if key in admin_web_params:
                  targets.append(admin_web_stack)
              if key in public_params:
                  targets.append(public_stack)
              if key in training_params:
                  targets.append(training_stack)
              if key in backend_cors_domain_params:
                  targets.append(backend_stack)
              if not targets:
                  targets.append(backend_stack)

              for target in targets:
                  if target not in stack_set:
                      continue
                  # Emit NUL-delimited tokens so multiline values (e.g. PEM keys)
                  # are preserved as single CLI arguments.
                  sys.stdout.buffer.write(b"--parameters\0")
                  sys.stdout.buffer.write(
                      f"{target}:{key}={value_str}".encode("utf-8") + b"\0"
                  )
          PY
            mapfile -d '' -t PARAM_ARGS < "$PARAM_ARGS_FILE"
          fi

          RUN_SEED_DATA_NORMALIZED="$(printf '%s' "${RUN_SEED_DATA:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$RUN_SEED_DATA_NORMALIZED" = "true" ]; then
            if [[ " $CDK_STACKS " == *" evolvesprouts "* ]]; then
              FILTERED_PARAM_ARGS=()
              for arg in "${PARAM_ARGS[@]}"; do
                if [[ "$arg" == "evolvesprouts:RunSeedData="* ]]; then
                  continue
                fi
                FILTERED_PARAM_ARGS+=("$arg")
              done
              PARAM_ARGS=("${FILTERED_PARAM_ARGS[@]}")
              PARAM_ARGS+=("--parameters" "evolvesprouts:RunSeedData=true")
              echo "RunSeedData override enabled for evolvesprouts stack."
            else
              echo "run_seed_data=true requested, but backend stack is not selected; skipping seed override."
            fi
          fi

          QUALIFIER_ARGS=()
          if [ -n "$CDK_BOOTSTRAP_QUALIFIER" ]; then
            QUALIFIER_ARGS=(--qualifier "$CDK_BOOTSTRAP_QUALIFIER")
          fi

          IFS=$', \n\t' read -r -a STACK_LIST <<< "$CDK_STACKS"

          # Lambda occasionally returns 500 during UpdateFunctionCode (SDK retries
          # exhaust inside CloudFormation). Brief backoff + redeploy usually succeeds.
          # Some CloudFormation rollbacks themselves fail (e.g., CloudFront Functions
          # rate-limit during rollback) and leave the stack wedged in
          # UPDATE_ROLLBACK_FAILED, which CloudFormation then refuses to update
          # further. Detect that state and call ``continue-update-rollback`` to
          # nudge it back to ``UPDATE_ROLLBACK_COMPLETE`` before the next retry.
          MANAGED_STACKS=(
            evolvesprouts
            evolvesprouts-admin-web
            evolvesprouts-public-www
            evolvesprouts-training
          )

          continue_rollback_for_wedged_stacks() {
            for managed in "${MANAGED_STACKS[@]}"; do
              if [[ ! " $CDK_STACKS " == *" $managed "* ]]; then
                continue
              fi
              local status
              status="$(aws cloudformation describe-stacks \
                --stack-name "$managed" \
                --region "$AWS_REGION" \
                --query 'Stacks[0].StackStatus' \
                --output text 2>/dev/null || echo MISSING)"
              if [ "$status" != "UPDATE_ROLLBACK_FAILED" ]; then
                continue
              fi
              echo "Stack ${managed} is in UPDATE_ROLLBACK_FAILED; calling continue-update-rollback."
              if ! aws cloudformation continue-update-rollback \
                --stack-name "$managed" \
                --region "$AWS_REGION"; then
                echo "continue-update-rollback failed for ${managed}; the next deploy attempt will report the wedged state."
                continue
              fi
              echo "Waiting for ${managed} to reach UPDATE_ROLLBACK_COMPLETE (timeout ~15m)."
              if ! aws cloudformation wait stack-rollback-complete \
                --stack-name "$managed" \
                --region "$AWS_REGION"; then
                echo "Wait for stack-rollback-complete on ${managed} timed out or failed."
              fi
            done
          }

          MAX_CDK_DEPLOY_ATTEMPTS=3
          attempt=1
          deploy_exit=1
          while [ "$attempt" -le "$MAX_CDK_DEPLOY_ATTEMPTS" ]; do
            echo "CDK deploy attempt ${attempt} of ${MAX_CDK_DEPLOY_ATTEMPTS}"
            ATTEMPT_LOG="$(mktemp)"
            npx cdk deploy --no-notices --require-approval never \
              "${QUALIFIER_ARGS[@]}" "${PARAM_ARGS[@]}" "${STACK_LIST[@]}" 2>&1 | tee "$ATTEMPT_LOG"
            deploy_exit=${PIPESTATUS[0]}
            if [ "$deploy_exit" -eq 0 ]; then
              rm -f "$ATTEMPT_LOG"
              exit 0
            fi

            if grep -Eiq 'HandlerErrorCode: (InvalidRequest|AlreadyExists)|must be in ARN format or "\\*"|already exists\.' "$ATTEMPT_LOG"; then
              echo "Detected non-retryable CloudFormation error; failing fast without additional retries."
              rm -f "$ATTEMPT_LOG"
              exit "$deploy_exit"
            fi

            saw_rollback_failed=0
            if grep -Eiq 'is in UPDATE_ROLLBACK_FAILED state and can not be updated' "$ATTEMPT_LOG"; then
              saw_rollback_failed=1
            fi

            rm -f "$ATTEMPT_LOG"
            if [ "$attempt" -eq "$MAX_CDK_DEPLOY_ATTEMPTS" ]; then
              break
            fi

            if [ "$saw_rollback_failed" -eq 1 ]; then
              echo "Detected UPDATE_ROLLBACK_FAILED; attempting continue-update-rollback before retry."
              continue_rollback_for_wedged_stacks
            fi

            delay=$((45 * attempt))
            echo "CDK deploy failed (exit ${deploy_exit}); waiting ${delay}s before retry..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          exit "$deploy_exit"
        env:
          AWS_REGION: ${{ steps.region.outputs.region }}
          CDK_STACKS: ${{ github.event.inputs.cdk_stacks || vars.CDK_STACKS || 'all stacks' }}
          RUN_SEED_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed_data || 'false' }}
          CDK_PARAM_FILE: ${{ vars.CDK_PARAM_FILE }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          CDK_PARAM_GOOGLE_CLIENT_SECRET: ${{ secrets.CDK_PARAM_GOOGLE_CLIENT_SECRET }}
          CDK_PARAM_APPLE_PRIVATE_KEY: ${{ secrets.CDK_PARAM_APPLE_PRIVATE_KEY }}
          CDK_PARAM_PUBLIC_API_KEY_VALUE: ${{ secrets.CDK_PARAM_PUBLIC_API_KEY_VALUE }}
          CDK_PARAM_TURNSTILE_SECRET_KEY: ${{ secrets.CDK_PARAM_TURNSTILE_SECRET_KEY }}
          CDK_PARAM_STRIPE_SECRET_KEY: ${{ secrets.CDK_PARAM_STRIPE_SECRET_KEY }}
          CDK_PARAM_STAGING_STRIPE_SECRET_KEY: ${{ secrets.CDK_PARAM_STAGING_STRIPE_SECRET_KEY }}
          CDK_PARAM_MAILCHIMP_API_SECRET_ARN: ${{ secrets.CDK_PARAM_MAILCHIMP_API_SECRET_ARN }}
          CDK_PARAM_MAILCHIMP_LIST_ID: ${{ vars.CDK_PARAM_MAILCHIMP_LIST_ID }}
          CDK_PARAM_MAILCHIMP_SERVER_PREFIX: ${{ vars.CDK_PARAM_MAILCHIMP_SERVER_PREFIX }}
          CDK_PARAM_MAILCHIMP_WEBHOOK_SECRET: ${{ secrets.CDK_PARAM_MAILCHIMP_WEBHOOK_SECRET }}
          CDK_PARAM_META_APP_SECRET: ${{ secrets.CDK_PARAM_META_APP_SECRET }}
          CDK_PARAM_WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.CDK_PARAM_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          CDK_PARAM_MAILCHIMP_MEDIA_DOWNLOAD_MERGE_TAG: ${{ vars.CDK_PARAM_MAILCHIMP_MEDIA_DOWNLOAD_MERGE_TAG }}
          CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_ID: ${{ vars.CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_ID }}
          CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_STEP_ID: ${{ vars.CDK_PARAM_MAILCHIMP_WELCOME_JOURNEY_STEP_ID }}
          CDK_PARAM_EVENTBRITE_TOKEN_SECRET_ARN: ${{ secrets.CDK_PARAM_EVENTBRITE_TOKEN_SECRET_ARN }}
          CDK_PARAM_EVENTBRITE_ORGANIZATION_ID: ${{ vars.CDK_PARAM_EVENTBRITE_ORGANIZATION_ID }}
          CDK_PARAM_MEDIA_DEFAULT_RESOURCE_KEY: ${{ vars.CDK_PARAM_MEDIA_DEFAULT_RESOURCE_KEY }}
          CDK_PARAM_SALES_RECAP_DISPLAY_TIMEZONE: ${{ vars.CDK_PARAM_SALES_RECAP_DISPLAY_TIMEZONE }}
          CDK_PARAM_OPENROUTER_API_KEY: ${{ secrets.CDK_PARAM_OPENROUTER_API_KEY }}
          CDK_PARAM_OPENROUTER_CHAT_COMPLETIONS_URL: ${{ vars.CDK_PARAM_OPENROUTER_CHAT_COMPLETIONS_URL }}
          CDK_PARAM_OPENROUTER_MODEL: ${{ vars.CDK_PARAM_OPENROUTER_MODEL }}
          CDK_PARAM_INBOUND_INVOICE_ALLOWED_SENDER_PATTERNS: ${{ vars.CDK_PARAM_INBOUND_INVOICE_ALLOWED_SENDER_PATTERNS }}
          STRIPE_PAYMENT_METHOD_CONFIGURATION_ID: ${{ vars.STRIPE_PAYMENT_METHOD_CONFIGURATION_ID }}
          CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD: ${{ secrets.CDK_PARAM_ADMIN_BOOTSTRAP_TEMP_PASSWORD }}
          CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PUBLIC_KEY_PEM: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PUBLIC_KEY_PEM }}
          CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_SECRET_ARN: ${{ secrets.CDK_PARAM_ASSET_DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_SECRET_ARN }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_BUSINESS_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_NAME }}
          NEXT_PUBLIC_BUSINESS_LEGAL_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_LEGAL_NAME }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_BILLING_EMAIL: ${{ vars.NEXT_PUBLIC_BILLING_EMAIL }}
          NEXT_PUBLIC_BUSINESS_REGISTRATION: ${{ vars.NEXT_PUBLIC_BUSINESS_REGISTRATION }}
          NEXT_PUBLIC_BANK_NAME: ${{ vars.NEXT_PUBLIC_BANK_NAME }}
          NEXT_PUBLIC_BANK_ACCOUNT_HOLDER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_HOLDER }}
          NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_NUMBER }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          CDK_PARAM_INVOICE_DISPLAY_TIMEZONE: ${{ vars.CDK_PARAM_INVOICE_DISPLAY_TIMEZONE }}
          CDK_PARAM_INVOICE_PAYMENT_TERMS_DAYS: ${{ vars.CDK_PARAM_INVOICE_PAYMENT_TERMS_DAYS }}
