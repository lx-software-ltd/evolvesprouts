name: Amplify Promote

on:
  repository_dispatch:
    types: [amplify-promote]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Amplify source branch (e.g., staging)"
        required: true
      target_branch:
        description: "Amplify target branch (e.g., main)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: amplify-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@b40bb0725bf84f25a38641f6ca5ec6f4c2f14f98 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Validate inputs and app configuration
        run: |
          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "AMPLIFY_APP_ID variable is required"
            exit 1
          fi
          if [ -z "$SOURCE_BRANCH" ] || [ -z "$TARGET_BRANCH" ]; then
            echo "source_branch and target_branch are required"
            exit 1
          fi
          if [ "$SOURCE_BRANCH" != "staging" ] || [ "$TARGET_BRANCH" != "main" ]; then
            echo "Only staging -> main promotions are allowed"
            exit 1
          fi
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}

      - name: Ensure source branch build is green
        run: |
          status=$(aws amplify list-jobs \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$SOURCE_BRANCH" \
            --max-items 1 \
            --query "jobSummaries[0].status" \
            --output text)
          echo "Latest job status on $SOURCE_BRANCH: $status"
          if [ "$status" != "SUCCEED" ]; then
            echo "Source branch build is not green"
            exit 1
          fi
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}

      - name: Checkout the pinned deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lx-software-ltd/actions
          ref: e6be2629d7206b0d5c079662f364772bc816acc1
          path: .actions-pin

      - name: Compare the dry run with the current release
        continue-on-error: true
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          real_aws="$(command -v aws)"
          bindir="$RUNNER_TEMP/aws-dry/bin"
          mkdir -p "$bindir"
          REAL_AWS="$real_aws" BINDIR="$bindir" LOG="$RUNNER_TEMP/amplify-action.txt" python3 - << 'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["BINDIR"]) / "aws"
          path.write_text(
              "#!/usr/bin/env bash\n"
              "set -euo pipefail\n"
              f"real={os.environ['REAL_AWS']!r}\n"
              f"log={os.environ['LOG']!r}\n"
              'if [[ "$1" == "amplify" && "$2" == "start-job" ]]; then\n'
              "  printf 'aws %s\\n' \"$*\" >> \"$log\"\n"
              "  printf '%s\\n' '{\"jobSummary\":{\"jobId\":\"dry-run\"}}'\n"
              "  exit 0\n"
              "fi\n"
              'exec "$real" "$@"\n'
          )
          path.chmod(0o755)
          PY
          : > "$RUNNER_TEMP/amplify-action.txt"
          PATH="$bindir:$PATH" \
            APP_ID="$AMPLIFY_APP_ID" \
            BRANCH="$TARGET_BRANCH" \
            MODE=promote \
            SOURCE_BRANCH="$SOURCE_BRANCH" \
            WAIT=false \
            python3 "$GITHUB_WORKSPACE/.actions-pin/amplify-release/amplify_release.py"
          printf 'aws amplify start-job --app-id %s --branch-name %s --job-type RELEASE\n' "$AMPLIFY_APP_ID" "$TARGET_BRANCH" > "$RUNNER_TEMP/amplify-current.txt"
          CURRENT="$RUNNER_TEMP/amplify-current.txt" ACTION="$RUNNER_TEMP/amplify-action.txt" python3 - << 'PY'
          import os
          import sys
          from pathlib import Path

          def norm(text):
              found = []
              for line in text.splitlines():
                  if "start-job" not in line:
                      continue
                  tokens = line.split()
                  kept = []
                  skip = False
                  for token in tokens:
                      if skip:
                          skip = False
                          continue
                      if token == "--output":
                          skip = True
                          continue
                      kept.append(token)
                  found.append(kept)
              return found

          current = norm(Path(os.environ["CURRENT"]).read_text(encoding="utf-8"))
          action = norm(Path(os.environ["ACTION"]).read_text(encoding="utf-8"))
          if current != action or not current:
              print("planned Amplify releases differ", file=sys.stderr)
              print("current: " + str(current), file=sys.stderr)
              print("action: " + str(action), file=sys.stderr)
              raise SystemExit(1)
          print(f"Dry run matches the current deploy ({len(current)} planned Amplify RELEASE)")
          PY

      - name: Promote to target branch
        run: |
          aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$TARGET_BRANCH" \
            --job-type RELEASE
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
