name: Lighthouse Public Website

on:
  workflow_dispatch:
    inputs:
      page_paths:
        # template:set
        description: "Comma/newline-separated page paths or full URLs to audit (e.g. /en/, /en/about-us)"
        # template:end
        required: false
        # template:set
        default: "/en/,/zh-CN/,/zh-HK/"
        # template:end
  pull_request:
    paths:
      - "apps/public_www/**"
      - ".github/workflows/lighthouse-public-www.yml"
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

concurrency:
  group: lighthouse-public-www-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    permissions:
      contents: read
      statuses: write
    name: Lighthouse audit
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # template:set
        with:
          lfs: false
        # template:end

      # template:optional public-build-env
      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh
        env:
          REQUIRE_ASSET: "false"

      # template:end

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8ed507ce395319e1cb0b1d40d26a5f5897cf211f # main 2026-11-28
        with:
          cache: npm
          working-directory: apps/public_www

      # template:optional next-public
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/public_www/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/public_www/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      # template:end

      - name: Build public website
        working-directory: apps/public_www
        # template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_FOUNDER_NAME: ${{ vars.NEXT_PUBLIC_FOUNDER_NAME }}
        # template:end
        run: npm run build

      - name: Run Lighthouse CI
        uses: lx-software-ltd/actions/lighthouse-ci@8ed507ce395319e1cb0b1d40d26a5f5897cf211f # main 2026-11-28
        with:
          working-directory: apps/public_www
          page-paths: ${{ inputs.page_paths }}
          # template:set
          default-paths: /en/,/zh-CN/,/zh-HK/
          # template:end
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-public-www-results
          path: apps/public_www/.lighthouseci/**
          if-no-files-found: warn
          include-hidden-files: true
