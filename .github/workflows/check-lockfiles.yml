name: Check Lockfiles
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

on:
  repository_dispatch:
    types: [check-lockfiles]
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter-lockfiles:
    name: Check Flutter lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.50.1 is the stable SDK from the Set up Flutter step in the
      # successful Check Flutter lockfiles job 136884245510 (run
      # 44916864555, commit 58ab636, 2026-11-21). The setup script was
      # invoked with -n 3.50.1.
      - name: Validate pubspec.lock
        uses: lx-software-ltd/actions/flutter-lockfiles@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          working-directory: apps/evolvesprouts_app
          flutter-version: "3.50.1"

  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          directories: |
            apps/admin_web
            apps/public_www
            apps/training
            backend/infrastructure

  ios-lockfiles:
    name: Check iOS lockfiles
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Podfile.lock
        uses: lx-software-ltd/actions/pod-lockfiles@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          working-directory: apps/evolvesprouts_app/ios

  python-requirements:
    name: Check Python requirements
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate requirements.txt pins
        uses: lx-software-ltd/actions/python-requirements-pins@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          files: backend/requirements.txt
