name: Check Lockfiles

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # template:optional flutter-lockfiles
  flutter-lockfiles:
    name: Check Flutter lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Flutter lockfile
        uses: lx-software-ltd/actions/flutter-lockfiles@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          # template:set
          working-directory: apps/evolvesprouts_app
          # template:end

  # template:end
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          # template:set
          directories: |
            apps/admin_web
            apps/public_www
            apps/training
            backend/infrastructure
          # template:end

  # template:optional ios-lockfiles
  ios-lockfiles:
    name: Check iOS lockfiles
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Podfile.lock
        uses: lx-software-ltd/actions/pod-lockfiles@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          # template:set
          working-directory: apps/evolvesprouts_app/ios
          # template:end

  # template:end
  python-requirements:
    name: Check Python requirements
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@1d66ad00053fdbea390c4d2c3f4b89d8c31cfdfc # main 2026-11-24
        with:
          # template:set
          files: backend/requirements.txt
          # template:end
