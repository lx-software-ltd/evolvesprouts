name: Check Lockfiles

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # template:optional mobile
  flutter-lockfiles:
    name: Check Flutter lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Flutter lockfile
        uses: lx-software-ltd/actions/flutter-lockfiles@9ce7ed3d92dd8cb572934f402cf3f6f20e48128d # main 2026-11-26
        with:
          # template:set
          working-directory: apps/evolvesprouts_app
          # template:end

  # template:end
  node-lockfiles:
    name: Check Node.js lockfiles
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@9ce7ed3d92dd8cb572934f402cf3f6f20e48128d # main 2026-11-26

      - name: Validate package-lock.json
        uses: lx-software-ltd/actions/node-lockfiles@9ce7ed3d92dd8cb572934f402cf3f6f20e48128d # main 2026-11-26
        with:
          # template:set
          directories: |
            apps/admin_web
            apps/public_www
            apps/training
            backend/infrastructure
          # template:end

  python-requirements:
    name: Check Python requirements
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirement pins
        uses: lx-software-ltd/actions/python-requirements-pins@9ce7ed3d92dd8cb572934f402cf3f6f20e48128d # main 2026-11-26
        with:
          # template:set
          files: backend/requirements.txt
          # template:end
