name: Deploy Admin Web

on:
  repository_dispatch:
    types: [deploy-admin-web]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin_web/**"
      - "packages/react_ui/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin_web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/admin_web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Build admin web
        run: npm run build
        working-directory: apps/admin_web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PUBLIC_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_SITE_BASE_URL }}
          NEXT_PUBLIC_TRAINING_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_TRAINING_SITE_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Deploy admin web
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          source: apps/admin_web/out
          stack: evolvesprouts-admin-web
          region: ${{ vars.AWS_REGION }}
          bucket-output: AdminWebBucketName
          distribution-output: AdminWebDistributionId
          profile: next-export
          dry-run: "false"
