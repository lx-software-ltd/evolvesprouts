name: Deploy Admin Web

on:
  repository_dispatch:
    types: [deploy-admin-web]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin_web/**"
      - "packages/react_ui/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/admin_web

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin_web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/admin_web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Build admin web
        run: npm run build
        working-directory: apps/admin_web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PUBLIC_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_SITE_BASE_URL }}
          NEXT_PUBLIC_TRAINING_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_TRAINING_SITE_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@daa2fd06bb4a9580a3d3302f9127a66da39d940e # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Read the admin website outputs
        id: site
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          stack="${ADMIN_WEB_STACK_NAME:-evolvesprouts-admin-web}"
          bucket="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='AdminWebBucketName'].OutputValue" --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='AdminWebDistributionId'].OutputValue" --output text)"
          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "Admin web bucket output not found for $stack" >&2
            exit 1
          fi
          if [ "$distribution" = "None" ]; then
            distribution=""
          fi
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"

      - name: Deploy admin web
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@daa2fd06bb4a9580a3d3302f9127a66da39d940e # main 2026-11-23
        with:
          source: apps/admin_web/out
          bucket: ${{ steps.site.outputs.bucket }}
          distribution-id: ${{ steps.site.outputs.distribution }}
          profile: next-export
          dry-run: "false"
