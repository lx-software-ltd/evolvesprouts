name: Deploy Admin Web

on:
  repository_dispatch:
    types: [deploy-admin-web]
  workflow_dispatch:
  push:
    branches:
      - main
    # template:set
    paths:
      - "apps/admin_web/**"
      - "scripts/**"
    # template:end


permissions:
  contents: read

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@0e5dbcbbe9fb3dc7eff728b7725de461a3a2ff6f # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      # template:optional next-admin
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin_web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/admin_web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      # template:end

      - name: Configure AWS credentials
        id: aws
        uses: lx-software-ltd/actions/aws-oidc@0e5dbcbbe9fb3dc7eff728b7725de461a3a2ff6f # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}


      - name: Build admin web
        run: npm run build
        working-directory: apps/admin_web
        # template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PUBLIC_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_SITE_BASE_URL }}
          NEXT_PUBLIC_TRAINING_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_TRAINING_SITE_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        # template:end

      - name: Deploy admin web
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@0e5dbcbbe9fb3dc7eff728b7725de461a3a2ff6f # main 2026-11-24
        with:
          # template:set
          source: apps/admin_web/out
          stack: evolvesprouts-admin-web
          # template:end
          region: ${{ vars.AWS_REGION }}
          bucket-output: AdminWebBucketName
          distribution-output: AdminWebDistributionId
          # template:set
          profile: next-export
          # template:end
          dry-run: "false"
