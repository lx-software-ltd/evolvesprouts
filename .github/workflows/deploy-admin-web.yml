name: Deploy Admin Web

on:
  repository_dispatch:
    types: [deploy-admin-web]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/admin_web/**"
      - "packages/react_ui/**"
      - "scripts/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: apps/admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/admin_web

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin_web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/admin_web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Build admin web
        run: npm run build
        working-directory: apps/admin_web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PUBLIC_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_SITE_BASE_URL }}
          NEXT_PUBLIC_TRAINING_SITE_BASE_URL: ${{ vars.NEXT_PUBLIC_TRAINING_SITE_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@b40bb0725bf84f25a38641f6ca5ec6f4c2f14f98 # main 2026-11-23
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}

      - name: Checkout the pinned deploy action
        if: ${{ success() && vars.AMPLIFY_APP_ID != '' && vars.AMPLIFY_BRANCH != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lx-software-ltd/actions
          ref: e6be2629d7206b0d5c079662f364772bc816acc1
          path: .actions-pin

      - name: Compare the dry run with the current release
        if: ${{ success() && vars.AMPLIFY_APP_ID != '' && vars.AMPLIFY_BRANCH != '' }}
        continue-on-error: true
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          real_aws="$(command -v aws)"
          bindir="$RUNNER_TEMP/aws-dry/bin"
          mkdir -p "$bindir"
          REAL_AWS="$real_aws" BINDIR="$bindir" LOG="$RUNNER_TEMP/amplify-action.txt" python3 - << 'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["BINDIR"]) / "aws"
          path.write_text(
              "#!/usr/bin/env bash\n"
              "set -euo pipefail\n"
              f"real={os.environ['REAL_AWS']!r}\n"
              f"log={os.environ['LOG']!r}\n"
              'if [[ "$1" == "amplify" && "$2" == "start-job" ]]; then\n'
              "  printf 'aws %s\\n' \"$*\" >> \"$log\"\n"
              "  printf '%s\\n' '{\"jobSummary\":{\"jobId\":\"dry-run\"}}'\n"
              "  exit 0\n"
              "fi\n"
              'exec "$real" "$@"\n'
          )
          path.chmod(0o755)
          PY
          : > "$RUNNER_TEMP/amplify-action.txt"
          PATH="$bindir:$PATH" \
            APP_ID="$AMPLIFY_APP_ID" \
            BRANCH="$AMPLIFY_BRANCH" \
            MODE=release \
            WAIT=false \
            python3 "$GITHUB_WORKSPACE/.actions-pin/amplify-release/amplify_release.py"
          printf 'aws amplify start-job --app-id %s --branch-name %s --job-type RELEASE\n' "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" > "$RUNNER_TEMP/amplify-current.txt"
          CURRENT="$RUNNER_TEMP/amplify-current.txt" ACTION="$RUNNER_TEMP/amplify-action.txt" python3 - << 'PY'
          import os
          import sys
          from pathlib import Path

          def norm(text):
              found = []
              for line in text.splitlines():
                  if "start-job" not in line:
                      continue
                  tokens = line.split()
                  kept = []
                  skip = False
                  for token in tokens:
                      if skip:
                          skip = False
                          continue
                      if token == "--output":
                          skip = True
                          continue
                      kept.append(token)
                  found.append(kept)
              return found

          current = norm(Path(os.environ["CURRENT"]).read_text(encoding="utf-8"))
          action = norm(Path(os.environ["ACTION"]).read_text(encoding="utf-8"))
          if current != action or not current:
              print("planned Amplify releases differ", file=sys.stderr)
              print("current: " + str(current), file=sys.stderr)
              print("action: " + str(action), file=sys.stderr)
              raise SystemExit(1)
          print(f"Dry run matches the current deploy ({len(current)} planned Amplify RELEASE)")
          PY

      - name: Trigger Amplify Hosting release
        if: ${{ success() && vars.AMPLIFY_APP_ID != '' && vars.AMPLIFY_BRANCH != '' }}
        run: |
          aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}

      - name: Deploy admin web
        run: |
          if [ -f "scripts/deploy/deploy-admin-web.sh" ]; then
            bash "scripts/deploy/deploy-admin-web.sh"
          else
            echo "Deploy script not found: scripts/deploy/deploy-admin-web.sh"
          fi
