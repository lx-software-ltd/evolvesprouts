name: CDK Diff

on:
  repository_dispatch:
    types: [cdk-diff]
  workflow_dispatch:
    inputs:
      stacks:
        description: 'Optional space/comma-separated CDK stack names'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: cdk-diff
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: 'npm'
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Install infrastructure dependencies
        working-directory: backend/infrastructure
        run: npm ci

      - name: Run CDK diff
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          npm run build --if-present
          # The CDK app reads CDK_BOOTSTRAP_QUALIFIER. `cdk diff` has no
          # --qualifier flag; passing one is ignored.
          STACK_ARGS=()
          if [ -n "${CDK_STACKS:-}" ]; then
            IFS=$', \n\t' read -r -a STACK_LIST <<< "$CDK_STACKS"
            for stack in "${STACK_LIST[@]}"; do
              trimmed="${stack#"${stack%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$trimmed" ]; then
                STACK_ARGS+=("$trimmed")
              fi
            done
          fi
          if [ ${#STACK_ARGS[@]} -gt 0 ]; then
            npx cdk diff --no-color "${STACK_ARGS[@]}"
          else
            npx cdk diff --no-color
          fi
        env:
          CDK_STACKS: ${{ inputs.stacks }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
