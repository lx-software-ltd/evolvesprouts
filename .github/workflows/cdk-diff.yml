name: CDK Diff

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/cdk-diff.yml"
  repository_dispatch:
    types: [cdk-diff]
  workflow_dispatch:
    inputs:
      stacks:
        description: 'Optional space/comma-separated CDK stack names'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cdk-diff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diff:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    env:
      CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@cd643d664bed34eca3fbb1e77edcb498e7ff6ef6 # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure
          install: "false"

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@cd643d664bed34eca3fbb1e77edcb498e7ff6ef6 # main 2026-11-24

      - name: Refuse the deploy role on a pull request
        if: github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_NAME == 'GitHubActionsRole'
        run: |
          echo "::error::AWS_DIFF_ROLE_NAME must name a read-only role. A pull request does not assume GitHubActionsRole."
          exit 1

      - name: Configure AWS credentials
        id: aws
        if: github.event_name != 'pull_request' || vars.AWS_DIFF_ROLE_NAME != ''
        uses: lx-software-ltd/actions/aws-oidc@cd643d664bed34eca3fbb1e77edcb498e7ff6ef6 # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}
          role-name: ${{ github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_NAME || 'GitHubActionsRole' }}
          required: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

      - name: Note when a pull request diff did not run
        if: github.event_name == 'pull_request' && steps.aws.outputs.ready != 'true'
        run: |
          echo "::warning::This pull request did not assume a role. Set AWS_DIFF_ROLE_NAME to a read-only role that trusts only pull_request. GitHubActionsRole is not assumed from a pull request."

      - name: Install infrastructure dependencies
        if: steps.aws.outputs.ready == 'true'
        working-directory: backend/infrastructure
        run: npm ci

      - name: Check CDK Bootstrap status
        if: steps.aws.outputs.ready == 'true'
        uses: lx-software-ltd/actions/cdk-bootstrap-check@cd643d664bed34eca3fbb1e77edcb498e7ff6ef6 # main 2026-11-24
        with:
          qualifier: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}
          region: ${{ vars.AWS_REGION }}

      - name: Prepare CDK diff
        if: steps.aws.outputs.ready == 'true'
        id: prep
        working-directory: backend/infrastructure
        run: |
          npx cdk acknowledge 34892 || true
          npm run build --if-present
          # The CDK app reads CDK_BOOTSTRAP_QUALIFIER. `cdk diff` has no
          # --qualifier flag; passing one is ignored. The plan resolves a
          # label such as "admin web"; an empty value diffs every stack.
          {
            echo "run=true"
            echo "stacks=${CDK_STACKS}"
          } >> "$GITHUB_OUTPUT"
        env:
          CDK_STACKS: ${{ inputs.stacks }}
          CDK_BOOTSTRAP_QUALIFIER: ${{ vars.CDK_BOOTSTRAP_QUALIFIER }}

      - name: Run CDK diff
        if: steps.aws.outputs.ready == 'true' && steps.prep.outputs.run == 'true'
        uses: lx-software-ltd/actions/cdk-diff@cd643d664bed34eca3fbb1e77edcb498e7ff6ef6 # main 2026-11-24
        with:
          working-directory: backend/infrastructure
          stacks: ${{ steps.prep.outputs.stacks }}
          plan-file: backend/infrastructure/cdk-plan.json
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
