name: Deploy Mobile App

on:
  repository_dispatch:
    types: [deploy-mobile]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/evolvesprouts_app/**"
      - "packages/flutter_ui/**"
      - "packages/api_client_dart/**"
      - "packages/models_shared/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      KEYSTORE_PATH: app/keystore.p12
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-24.04 is pinned because ubuntu-latest moves to a new image on
      # GitHub's schedule. That image defaults to Java 17 and also installs
      # Java 25. Gradle 8.14 cannot run on Java 25, and this app compiles for
      # Java 17.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Point Flutter at Java 17
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Configure Android signing
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Skipping Android signing (missing secrets)"
            exit 0
          fi
          mkdir -p apps/evolvesprouts_app/android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/evolvesprouts_app/android/app/keystore.p12
          chmod 600 apps/evolvesprouts_app/android/app/keystore.p12
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/evolvesprouts_app

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=AMPLIFY_API_KEY=${{ secrets.AMPLIFY_API_KEY }} \
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_APP_CHECK_DEBUG=${{ vars.FIREBASE_APP_CHECK_DEBUG }}
        working-directory: apps/evolvesprouts_app

      - name: Check Play Store upload prerequisites
        id: playstore
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ] || [ -z "$ANDROID_RELEASE_TRACK" ]; then
            echo "Skipping Play Store upload (missing config)"
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Skipping Play Store upload (missing Android signing secrets)"
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_upload=true" >> "$GITHUB_OUTPUT"
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          ANDROID_RELEASE_TRACK: ${{ vars.ANDROID_RELEASE_TRACK }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload AAB to Play Store
        if: ${{ steps.playstore.outputs.should_upload == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.evolvesprouts
          releaseFiles: apps/evolvesprouts_app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.ANDROID_RELEASE_TRACK }}

      - name: Deploy mobile artifacts
        run: |
          if [ -f "scripts/deploy/deploy-mobile.sh" ]; then
            bash "scripts/deploy/deploy-mobile.sh"
          else
            echo "Deploy script not found: scripts/deploy/deploy-mobile.sh"
          fi
