name: Deploy Mobile App

on:
  repository_dispatch:
    types: [deploy-mobile]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/evolvesprouts_app/**"
      - "packages/flutter_ui/**"
      - "packages/api_client_dart/**"
      - "packages/models_shared/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04
    environment: production
    env:
      KEYSTORE_PATH: app/keystore.p12
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job runs on ubuntu-26.04. Android Gradle Plugin 9.3 lint calls
      # List.removeLast(), which exists only on Java 21 and newer. The app
      # still compiles for Java 17.
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: lx-software-ltd/actions/setup-flutter@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          channel: "stable"
          flutter-version: "3.50.1"
          cache: "true"

      - name: Point Flutter at Java 21
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Configure Android signing
        uses: lx-software-ltd/actions/android-signing@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          working-directory: apps/evolvesprouts_app
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/evolvesprouts_app

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=AMPLIFY_API_KEY=${{ secrets.AMPLIFY_API_KEY }} \
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_APP_CHECK_DEBUG=${{ vars.FIREBASE_APP_CHECK_DEBUG }}
        working-directory: apps/evolvesprouts_app

      - name: Check Play Store upload prerequisites
        id: playstore
        uses: lx-software-ltd/actions/play-prerequisites@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          service-account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          track: ${{ vars.ANDROID_RELEASE_TRACK }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload AAB to Play Store
        if: ${{ steps.playstore.outputs.should_upload == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.evolvesprouts
          releaseFiles: apps/evolvesprouts_app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ vars.ANDROID_RELEASE_TRACK }}

      - name: Deploy mobile artifacts
        run: |
          if [ -f "scripts/deploy/deploy-mobile.sh" ]; then
            bash "scripts/deploy/deploy-mobile.sh"
          else
            echo "Deploy script not found: scripts/deploy/deploy-mobile.sh"
          fi
