name: Security Scanning
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans weekly on Mondays at 8:00 UTC
    - cron: '0 8 * * 1'
  repository_dispatch:
    types: [security]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Checkov IaC Security
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Acknowledge CDK CLI notice
        working-directory: backend/infrastructure
        run: npx cdk acknowledge 34892 || true

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
        run: npx cdk synth --quiet --output cdk.out

      - name: Run Checkov
        uses: lx-software-ltd/actions/checkov-cloudformation@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          directory: backend/infrastructure/cdk.out
          config-file: backend/infrastructure/.checkov.yaml

  codeql:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    name: CodeQL Analysis
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyze
        uses: lx-software-ltd/actions/codeql@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          language: ${{ matrix.language }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
          category: "/language:${{ matrix.language }}"

  pii-denylist:
    permissions:
      contents: read
    name: PII denylist
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          python-version: "3.12"

      - name: Check hashed PII denylist
        uses: lx-software-ltd/actions/pii-denylist@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          denylist-path: scripts/pii-denylist.sha256

  secrets-scan:
    permissions:
      contents: read
    name: Secret Scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The shared action runs the MIT-licensed CLI. The licensed
      # gitleaks-action cannot read Actions secrets on Dependabot pull
      # requests, so those runs failed with a missing license.
      - name: Run Gitleaks
        uses: lx-software-ltd/actions/gitleaks@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          config-path: .gitleaks.toml

  dependency-audit:
    permissions:
      contents: read
    name: Python Dependency Audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          python-version: "3.12"

      # Ignored advisories:
      # - PYSEC-2025-183 / CVE-2025-45768: disputed by the pyjwt maintainer
      #   (advisory states "this is disputed by the Supplier because the key
      #   length is chosen by the application that uses the library").
      #   Affects all pyjwt versions with no published fix version, so it is
      #   not actionable here. Application code that signs/verifies JWTs is
      #   responsible for enforcing minimum key length.
      # 22 Nov 2026: ignore-vulns is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when one is ignored.
      - name: Audit Python requirements
        uses: lx-software-ltd/actions/pip-audit@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          requirements: backend/requirements.txt
          ignore-vulns: PYSEC-2025-183

  bandit:
    permissions:
      contents: read
    name: Bandit Security Linter
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          python-version: "3.12"

      # Measured 22 Nov 2026 with Bandit 1.9.4 on backend/src and
      # backend/lambda. No high findings and no B105 or B106 findings.
      # Two B310 urlopen calls are marked on the line: cfn_response.py
      # allows only HTTPS hosts ending in .amazonaws.com, and aws_proxy.py
      # allows only http and https URLs on the proxy allow-list.
      - name: Run Bandit
        uses: lx-software-ltd/actions/bandit@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          paths: src lambda
          root: backend

  npm-audit:
    permissions:
      contents: read
    name: npm audit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23

      # 22 Nov 2026: audit-level is the hatch for an upstream advisory
      # with no fix. A dated reason goes on this step when the level changes.
      - name: Audit npm lockfiles
        uses: lx-software-ltd/actions/npm-audit@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          directories: |
            apps/admin_web
            apps/public_www
            apps/training
            backend/infrastructure
          audit-level: high

  security-summary:
    permissions:
      contents: read
    name: security-summary
    runs-on: ubuntu-26.04
    needs: [checkov, codeql, pii-denylist, secrets-scan, dependency-audit, bandit, npm-audit]
    if: always()
    steps:
      - name: Require every security job
        uses: lx-software-ltd/actions/require-jobs@a1816561097c19870cc3a4af1407b6ac2caddfe6 # main 2026-11-23
        with:
          needs-json: ${{ toJson(needs) }}
