name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans weekly on Mondays at 8:00 UTC
    - cron: '0 8 * * 1'
  repository_dispatch:
    types: [security]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  # Python dependency vulnerability scanning
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        # Ignored advisories:
        # - PYSEC-2025-183 / CVE-2025-45768: disputed by the pyjwt maintainer
        #   (advisory states "this is disputed by the Supplier because the key
        #   length is chosen by the application that uses the library").
        #   Affects all pyjwt versions with no published fix version, so it is
        #   not actionable here. Application code that signs/verifies JWTs is
        #   responsible for enforcing minimum key length.
        run: |
          pip-audit -r requirements.txt --desc on --ignore-vuln PYSEC-2025-183 --format json --output audit-results.json || true
          pip-audit -r requirements.txt --desc on --ignore-vuln PYSEC-2025-183

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-results
          path: backend/audit-results.json
          retention-days: 30

  # Python security linting with Bandit
  bandit:
    name: Bandit Security Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Bandit
        run: python -m pip install bandit[toml]

      - name: Run Bandit
        working-directory: backend
        # Rule skips (centralized suppressions):
        # - B310 (urllib_urlopen): Suppressed because cfn_response.py validates URLs
        #   before use (HTTPS only, .amazonaws.com hosts only), preventing the
        #   file:// scheme attack vector. See src/app/utils/cfn_response.py
        run: |
          bandit -r src lambda -f json -o bandit-results.json --skip B310 || true
          bandit -r src lambda -f txt --skip B310

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-results
          path: backend/bandit-results.json
          retention-days: 30

  # Infrastructure as Code scanning with Checkov
  checkov:
    name: Checkov IaC Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CDK dependencies
        working-directory: backend/infrastructure
        run: npm ci

      - name: Acknowledge CDK CLI notice
        working-directory: backend/infrastructure
        run: npx cdk acknowledge 34892 || true

      - name: Synthesize CDK templates
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
        run: npx cdk synth --quiet --output cdk.out

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        with:
          directory: backend/infrastructure/cdk.out
          config_file: backend/infrastructure/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,backend/infrastructure/checkov-results.sarif

      - name: Filter in-source suppressed Checkov findings
        id: filter_checkov_sarif
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_path = Path("backend/infrastructure/checkov-results.sarif")
          if not sarif_path.exists():
              print("checkov-results.sarif not found; skipping suppression filter.")
              payload = {"version": "2.1.0", "runs": []}
              output_path = Path(os.environ["RUNNER_TEMP"]) / "checkov-results.filtered.sarif"
              output_path.write_text(json.dumps(payload), encoding="utf-8")
              output_file = os.environ.get("GITHUB_OUTPUT")
              if output_file:
                  with open(output_file, "a", encoding="utf-8") as fh:
                      fh.write(f"filtered_sarif={output_path}\n")
              raise SystemExit(0)
          if sarif_path.is_dir():
              candidates = sorted(sarif_path.glob("*.sarif"))
              if not candidates:
                  print("No SARIF files found in checkov-results.sarif directory; skipping suppression filter.")
                  payload = {"version": "2.1.0", "runs": []}
                  output_path = Path(os.environ["RUNNER_TEMP"]) / "checkov-results.filtered.sarif"
                  output_path.write_text(json.dumps(payload), encoding="utf-8")
                  output_file = os.environ.get("GITHUB_OUTPUT")
                  if output_file:
                      with open(output_file, "a", encoding="utf-8") as fh:
                          fh.write(f"filtered_sarif={output_path}\n")
                  raise SystemExit(0)
              sarif_path = candidates[0]

          payload = json.loads(sarif_path.read_text(encoding="utf-8"))
          removed = 0
          for run in payload.get("runs", []):
              results = run.get("results", [])
              kept = []
              for result in results:
                  suppressions = result.get("suppressions", [])
                  if any(item.get("kind") == "inSource" for item in suppressions):
                      removed += 1
                      continue
                  kept.append(result)
              run["results"] = kept

          output_path = Path(os.environ["RUNNER_TEMP"]) / "checkov-results.filtered.sarif"
          output_path.write_text(json.dumps(payload), encoding="utf-8")
          output_file = os.environ.get("GITHUB_OUTPUT")
          if output_file:
              with open(output_file, "a", encoding="utf-8") as fh:
                  fh.write(f"filtered_sarif={output_path}\n")
          print(f"Removed {removed} in-source suppressed Checkov findings from SARIF.")
          PY

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ steps.filter_checkov_sarif.outputs.filtered_sarif }}
          # Checkov SARIF is large; do not fail job on processing wait jitter.
          wait-for-processing: false

  # CodeQL analysis (per-language matrix for Security tab categorization)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  # Secret scanning (in addition to GitHub's built-in scanning)
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Use the MIT-licensed gitleaks CLI instead of gitleaks-action.
      # The action requires GITLEAKS_LICENSE on organization repos, and
      # Dependabot pull_request runs cannot read Actions secrets
      # (Secret source: Dependabot), so the action fails with
      # "missing gitleaks license" on every Dependabot PR. The CLI
      # needs no license and still scans the checked-out history.
      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --redact --no-banner

  # SAST with Semgrep
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # Rule exclusions (centralized suppressions):
        # - dynamic-urllib-use-detected: Suppressed for cfn_response.py which validates
        #   URLs before use (HTTPS only, .amazonaws.com hosts only). The validation
        #   prevents the file:// scheme attack vector. See backend/src/app/utils/cfn_response.py
        run: |
          semgrep ci \
            --sarif \
            --output=semgrep-results.sarif \
            --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            || true
        env:
          SEMGREP_RULES: >-
            p/python
            p/security-audit
            p/secrets
            p/owasp-top-ten

      - name: Filter in-source suppressed Semgrep findings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("semgrep-results.sarif")
          if not sarif_path.exists():
              print("semgrep-results.sarif not found; skipping suppression filter.")
              raise SystemExit(0)

          payload = json.loads(sarif_path.read_text(encoding="utf-8"))
          removed = 0
          for run in payload.get("runs", []):
              results = run.get("results", [])
              kept = []
              for result in results:
                  suppressions = result.get("suppressions", [])
                  if any(item.get("kind") == "inSource" for item in suppressions):
                      removed += 1
                      continue
                  kept.append(result)
              run["results"] = kept

          sarif_path.write_text(json.dumps(payload), encoding="utf-8")
          print(f"Removed {removed} in-source suppressed Semgrep findings from SARIF.")
          PY

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # Summary job
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, bandit, checkov, codeql, secrets-scan, semgrep]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov | ${{ needs.checkov.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
