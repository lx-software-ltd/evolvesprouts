name: Deploy Public Website Staging

on:
  repository_dispatch:
    types: [deploy-public-www-staging]
  workflow_dispatch:
  push:
    branches:
# template:set
      - main
# template:end
    paths:
# template:set
      - "apps/public_www/**"
      - "scripts/deploy/deploy-public-www.sh"
      - "scripts/deploy/resolve-public-www-build-env.sh"
      - ".github/workflows/deploy-public-www-staging.yml"
# template:end

permissions:
  contents: read

concurrency:
  group: deploy-public-www-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@936d3fad83b00b4cc23a603717fdf804576c300c # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Audit public website production dependencies
        run: npm run audit:deps:prod
        working-directory: apps/public_www

      - name: Audit public website assets
        run: npm run audit:assets
        working-directory: apps/public_www


      - name: Run pre-build checks
        run: bash scripts/deploy/public-www-checks.sh pre-build
# template:set
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
# template:end

      - name: Configure AWS credentials
        uses: lx-software-ltd/actions/aws-oidc@936d3fad83b00b4cc23a603717fdf804576c300c # main 2026-11-24
        with:
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          region: ${{ vars.AWS_REGION }}


      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/public_www/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/public_www/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Build public website
        run: npm run build
        working-directory: apps/public_www
# template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_domains.outputs.production_site_origin }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          NEXT_PUBLIC_BANK_NAME: ${{ vars.NEXT_PUBLIC_BANK_NAME }}
          NEXT_PUBLIC_BANK_ACCOUNT_HOLDER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_HOLDER }}
          NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${{ vars.NEXT_PUBLIC_BANK_ACCOUNT_NUMBER }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_WWW_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_WWW_CRM_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STAGING_STRIPE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ASSET_SHARE_BASE_URL: ${{ steps.resolve_public_site_domains.outputs.asset_share_base_url }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_FOUNDER_NAME: ${{ vars.NEXT_PUBLIC_FOUNDER_NAME }}
# template:end

      - name: Run post-build checks
        run: bash scripts/deploy/public-www-checks.sh post-build

      - name: Optimize public website images
        run: bash scripts/deploy/deploy-public-www.sh
        env:
          PUBLIC_WWW_PHASE: optimize

      - name: Deploy public website
        uses: lx-software-ltd/actions/s3-cloudfront-deploy@936d3fad83b00b4cc23a603717fdf804576c300c # main 2026-11-24
        with:
          source: apps/public_www/out
# template:set
          stack: evolvesprouts-public-www
# template:end
          region: ${{ vars.AWS_REGION }}
          bucket-output: PublicWwwStagingBucketName
          distribution-output: ""
          profile: next-site
          release-id: ${{ github.sha }}
          release-marker: "true"
          sync-exclude: landing-pages-manifest.json
          staging-robots: "true"
          dry-run: "false"

      - name: Finish the staging release
        run: bash scripts/deploy/deploy-public-www.sh
        env:
          # template:set
          PUBLIC_WWW_STACK_NAME: evolvesprouts-public-www
          # template:end
          PUBLIC_WWW_ENVIRONMENT: staging
          PUBLIC_WWW_RELEASE_ID: ${{ github.sha }}
          PUBLIC_WWW_UPLOAD: external

      - name: Run staging smoke checks
        run: npm run smoke:staging
        working-directory: apps/public_www
# template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SMOKE_BASE_URL: ${{ steps.resolve_public_site_domains.outputs.staging_site_origin }}
          STAGING_BYPASS_SECRET: ${{ secrets.STAGING_BYPASS_SECRET }}
          SMOKE_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          SMOKE_CRM_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SMOKE_MEDIA_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
# template:end

      - name: Publish staging release summary
        run: bash scripts/deploy/publish-staging-summary.sh
        env:
          # template:set
          PUBLIC_WWW_STACK_NAME: evolvesprouts-public-www
          STAGING_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
          # template:end
