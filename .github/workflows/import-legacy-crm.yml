# Manual import from a legacy MariaDB SQL dump (entity-specific parsers).
#
# Flow: download the .sql → enforce ≤ 2 MB → upload to the import S3 bucket under
# `dumps/<entity>/<run_id>/<entity>.sql` → invoke ImportLegacyVenuesFunction
# with `{ entity, s3_bucket, s3_key, dry_run [, skip_legacy_keys] }`. The Lambda dispatches to the registered
# importer for that entity.
#
# **Production only** — fails unless the GitHub Environment name is `production`.
#
# GitHub Environment (production):
# - vars: `AWS_ACCOUNT_ID`, `AWS_REGION` (required).
# - optional vars: `IMPORT_DUMP_BUCKET_NAME`, `IMPORT_LAMBDA_FUNCTION_NAME`
#   (if omitted, workflow resolves from stack outputs `ImportDumpBucketName` and
#   `ImportLegacyFunctionName`/`ImportLegacyVenuesFunctionName` on stack `evolvesprouts`).
# - optional var: `IMPORT_LEGACY_CRM_SQL_OBJECT_KEY` — S3 object key (within the import bucket)
#   for an existing .sql file. Used when `sql_download_url` and secret `IMPORT_LEGACY_CRM_SQL_URL`
#   are both empty: the workflow checks the object exists, enforces size ≤ 2 MiB, passes it to the
#   Lambda, and does **not** delete this object after the run (ephemeral `dumps/...` uploads are still removed).
# - secrets (optional): `IMPORT_LEGACY_CRM_SQL_URL` when `sql_download_url` is empty (HTTPS download).
# - Obsolete for this workflow: runner-side `DATABASE_*` secrets — not used.
#
# IAM: `GitHubActionsRole` needs `s3:PutObject`, `s3:DeleteObject` on `dumps/*`, and
# `lambda:GetFunction` + `lambda:InvokeFunction` on the import Lambda.
#
# Security: do not echo presigned URLs. Step summary shows counts; for PII entities,
# `preview_allowed` is false on non-dry-run; dry-run still returns preview/row_details.
# CloudWatch logs are not echoed into the summary to avoid accidental data leakage.

name: Import legacy CRM

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Legacy CRM entity to import
        required: true
        type: choice
        options:
          - venues
          - families
          - organizations
          - contacts
          - notes
          - link_contact_memberships
          - labels
          - event_services
          - event_instances
          - event_instance_tags
          - event_enrollments
          - event_discount_codes
      sql_download_url:
        description: >
          HTTPS URL to the MariaDB .sql backup (optional if secret IMPORT_LEGACY_CRM_SQL_URL or
          repository var IMPORT_LEGACY_CRM_SQL_OBJECT_KEY is set).
        required: false
        type: string
      dry_run:
        description: If true, parse and resolve areas but do not insert into the database.
        required: false
        default: true
        type: boolean
      skip_legacy_keys:
        description: >
          Comma-separated legacy primary-key values to exclude from this import (e.g. venue ids).
          Leave empty to import every row from the dump.
        required: false
        type: string
      environment:
        description: GitHub Environment (must be `production` for this workflow).
        required: true
        type: environment

concurrency:
  group: import-legacy-crm-${{ github.event.inputs.environment }}-${{ github.event.inputs.entity }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  import:
    name: Upload dump and run import Lambda
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate environment (production only)
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" != "production" ]; then
            echo "This workflow is restricted to the production environment." >&2
            exit 1
          fi

      - name: Validate import workflow configuration
        id: config
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          MISSING_VARS=()
          [ -z "${AWS_ACCOUNT_ID:-}" ] && MISSING_VARS+=("AWS_ACCOUNT_ID")
          [ -z "${AWS_REGION:-}" ] && MISSING_VARS+=("AWS_REGION")
          if [ "${#MISSING_VARS[@]}" -gt 0 ]; then
            echo "Missing required environment variables: ${MISSING_VARS[*]}"
            echo "This run will be skipped until production environment vars are configured."
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_run=true" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.config.outputs.should_run == 'true' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: import-legacy-crm-${{ github.run_id }}

      - name: Resolve import resources (vars or stack outputs)
        if: ${{ steps.config.outputs.should_run == 'true' }}
        env:
          IMPORT_DUMP_BUCKET_NAME: ${{ vars.IMPORT_DUMP_BUCKET_NAME }}
          IMPORT_LAMBDA_FUNCTION_NAME: ${{ vars.IMPORT_LAMBDA_FUNCTION_NAME }}
          IMPORT_STACK_NAME: ${{ vars.IMPORT_STACK_NAME }}
        run: |
          set -euo pipefail
          STACK_NAME="${IMPORT_STACK_NAME:-evolvesprouts}"
          RESOLVED_BUCKET="${IMPORT_DUMP_BUCKET_NAME:-}"
          RESOLVED_FUNC="${IMPORT_LAMBDA_FUNCTION_NAME:-}"

          if [ -z "${RESOLVED_BUCKET:-}" ] || [ -z "${RESOLVED_FUNC:-}" ]; then
            STACK_EXISTS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackName' \
              --output text 2>/dev/null || true)
            if [ -z "${STACK_EXISTS:-}" ] || [ "${STACK_EXISTS}" = "None" ]; then
              echo "Stack ${STACK_NAME} not found and required import vars are missing." >&2
              echo "Set IMPORT_STACK_NAME or provide IMPORT_DUMP_BUCKET_NAME + IMPORT_LAMBDA_FUNCTION_NAME." >&2
              exit 1
            fi
          fi

          if [ -z "${RESOLVED_BUCKET:-}" ]; then
            RESOLVED_BUCKET=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='ImportDumpBucketName'].OutputValue | [0]" \
              --output text)
          fi
          if [ -z "${RESOLVED_FUNC:-}" ]; then
            RESOLVED_FUNC=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='ImportLegacyFunctionName'].OutputValue | [0]" \
              --output text)
          fi
          if [ -z "${RESOLVED_FUNC:-}" ] || [ "${RESOLVED_FUNC}" = "None" ]; then
            RESOLVED_FUNC=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='ImportLegacyVenuesFunctionName'].OutputValue | [0]" \
              --output text)
          fi

          if [ -z "${RESOLVED_BUCKET:-}" ] || [ "${RESOLVED_BUCKET}" = "None" ]; then
            echo "Could not resolve ImportDumpBucketName from stack ${STACK_NAME}." >&2
            exit 1
          fi
          if [ -z "${RESOLVED_FUNC:-}" ] || [ "${RESOLVED_FUNC}" = "None" ]; then
            echo "Could not resolve ImportLegacyFunctionName/ImportLegacyVenuesFunctionName from stack ${STACK_NAME}." >&2
            exit 1
          fi

          echo "IMPORT_DUMP_BUCKET=${RESOLVED_BUCKET}" >> "${GITHUB_ENV}"
          echo "IMPORT_LAMBDA_FUNCTION=${RESOLVED_FUNC}" >> "${GITHUB_ENV}"

      - name: Verify Lambda and IAM (preflight)
        if: ${{ steps.config.outputs.should_run == 'true' }}
        env:
          FUNC: ${{ env.IMPORT_LAMBDA_FUNCTION }}
          BUCKET: ${{ env.IMPORT_DUMP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${FUNC:-}" ]; then
            echo "Set IMPORT_LAMBDA_FUNCTION_NAME or stack output ImportLegacyFunctionName." >&2
            exit 1
          fi
          if [ -z "${BUCKET:-}" ]; then
            echo "Set IMPORT_DUMP_BUCKET_NAME or stack output ImportDumpBucketName." >&2
            exit 1
          fi
          echo "Checking Lambda exists: $FUNC"
          if ! aws lambda get-function --function-name "$FUNC" --query 'Configuration.FunctionArn' --output text; then
            echo "lambda:GetFunction failed. Fix IMPORT_LAMBDA_FUNCTION_NAME or IAM." >&2
            exit 1
          fi
          echo "Checking S3 bucket exists/access: $BUCKET"
          if ! aws s3api head-bucket --bucket "$BUCKET"; then
            echo "s3:HeadBucket failed. Fix IMPORT_DUMP_BUCKET_NAME or IAM." >&2
            exit 1
          fi

      - name: Download SQL dump or use bucket object key
        id: sql_dump
        if: ${{ steps.config.outputs.should_run == 'true' }}
        env:
          ENTITY: ${{ github.event.inputs.entity }}
          INPUT_URL: ${{ github.event.inputs.sql_download_url }}
          SECRET_URL: ${{ secrets.IMPORT_LEGACY_CRM_SQL_URL }}
          BUCKET: ${{ env.IMPORT_DUMP_BUCKET }}
          S3_SQL_OBJECT_KEY: ${{ vars.IMPORT_LEGACY_CRM_SQL_OBJECT_KEY }}
        run: |
          set -euo pipefail
          echo "use_existing_bucket_object=false" >> "${GITHUB_OUTPUT}"
          URL="${INPUT_URL:-}"
          if [ -z "${URL// }" ]; then
            URL="${SECRET_URL:-}"
          fi
          if [ -z "${URL// }" ]; then
            KEY_TRIMMED=$(echo "${S3_SQL_OBJECT_KEY:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -z "$KEY_TRIMMED" ]; then
              echo "Provide sql_download_url, set secret IMPORT_LEGACY_CRM_SQL_URL, or set repository variable IMPORT_LEGACY_CRM_SQL_OBJECT_KEY to an existing object key in the import bucket." >&2
              exit 1
            fi
            if [ -z "${BUCKET:-}" ]; then
              echo "IMPORT_DUMP_BUCKET is not set." >&2
              exit 1
            fi
            echo "Resolving SQL from s3://${BUCKET}/${KEY_TRIMMED}"
            if ! aws s3api head-object --bucket "$BUCKET" --key "$KEY_TRIMMED" --output json > /tmp/head.json; then
              echo "Object not found: s3://${BUCKET}/${KEY_TRIMMED}" >&2
              exit 1
            fi
            SIZE=$(jq -r '.ContentLength // 0' /tmp/head.json)
            if [ "$SIZE" -gt 2097152 ]; then
              echo "Dump exceeds 2 MB (size=$SIZE)." >&2
              exit 1
            fi
            echo "Using existing bucket object ($SIZE bytes); Lambda will read this key (no re-upload, no delete of this object)."
            echo "IMPORT_S3_KEY=${KEY_TRIMMED}" >> "${GITHUB_ENV}"
            echo "use_existing_bucket_object=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          curl -fsSL "$URL" -o "${RUNNER_TEMP}/${ENTITY}.sql"
          SIZE=$(wc -c < "${RUNNER_TEMP}/${ENTITY}.sql")
          echo "Downloaded SQL dump ($SIZE bytes)"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "Dump exceeds 2 MB." >&2
            exit 1
          fi

      - name: Upload dump to S3
        if: ${{ steps.config.outputs.should_run == 'true' && steps.sql_dump.outputs.use_existing_bucket_object != 'true' }}
        env:
          ENTITY: ${{ github.event.inputs.entity }}
          IMPORT_DUMP_BUCKET: ${{ env.IMPORT_DUMP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${IMPORT_DUMP_BUCKET:-}" ]; then
            echo "Set IMPORT_DUMP_BUCKET_NAME." >&2
            exit 1
          fi
          KEY="dumps/${ENTITY}/${GITHUB_RUN_ID}/${ENTITY}.sql"
          aws s3 cp "${RUNNER_TEMP}/${ENTITY}.sql" \
            "s3://${IMPORT_DUMP_BUCKET}/${KEY}" \
            --sse AES256
          echo "IMPORT_S3_KEY=${KEY}" >> "${GITHUB_ENV}"

      - name: Invoke import Lambda
        if: ${{ steps.config.outputs.should_run == 'true' }}
        env:
          ENTITY: ${{ github.event.inputs.entity }}
          BUCKET: ${{ env.IMPORT_DUMP_BUCKET }}
          KEY: ${{ env.IMPORT_S3_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SKIP_LEGACY_KEYS: ${{ github.event.inputs.skip_legacy_keys }}
          FUNC: ${{ env.IMPORT_LAMBDA_FUNCTION }}
        run: |
          set -euo pipefail
          if [ -z "${FUNC:-}" ]; then
            echo "Set IMPORT_LAMBDA_FUNCTION_NAME." >&2
            exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_JSON=true
          else
            DRY_JSON=false
          fi
          SKIP_TRIMMED=$(echo "${SKIP_LEGACY_KEYS:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SKIP_TRIMMED" ]; then
            PAYLOAD=$(jq -cn \
              --arg e "$ENTITY" --arg b "$BUCKET" --arg k "$KEY" --argjson d "$DRY_JSON" \
              '{entity:$e, s3_bucket:$b, s3_key:$k, dry_run:$d}')
          else
            PAYLOAD=$(jq -cn \
              --arg e "$ENTITY" --arg b "$BUCKET" --arg k "$KEY" --argjson d "$DRY_JSON" --arg sk "$SKIP_TRIMMED" \
              '{entity:$e, s3_bucket:$b, s3_key:$k, dry_run:$d, skip_legacy_keys:$sk}')
          fi
          META=$(aws lambda invoke \
            --function-name "$FUNC" \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            --log-type Tail \
            --output json \
            lambda-response-payload.json)
          echo "$META" | jq .
          echo "## Lambda import result" >> "${GITHUB_STEP_SUMMARY}"
          {
            echo '```json'
            jq 'if (.preview_allowed == false) and (.dry_run == false) then del(.preview, .row_details) else . end' lambda-response-payload.json || cat lambda-response-payload.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}" || true
          if echo "$META" | jq -e '.FunctionError != null' >/dev/null 2>&1; then
            echo "Lambda reported FunctionError" >&2
            echo "$META" >&2
            cat lambda-response-payload.json >&2
            exit 1
          fi
          if jq -e 'has("errorMessage")' lambda-response-payload.json >/dev/null 2>&1; then
            echo "Lambda payload contains errorMessage" >&2
            cat lambda-response-payload.json >&2
            exit 1
          fi

      - name: Remove uploaded dump from S3
        if: ${{ always() && steps.config.outputs.should_run == 'true' }}
        env:
          IMPORT_DUMP_BUCKET: ${{ env.IMPORT_DUMP_BUCKET }}
          KEY: ${{ env.IMPORT_S3_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${IMPORT_DUMP_BUCKET:-}" ] || [ -z "${KEY:-}" ]; then
            exit 0
          fi
          if [ "${{ steps.sql_dump.outputs.use_existing_bucket_object }}" = "true" ]; then
            echo "Skipping delete of repository-configured object s3://${IMPORT_DUMP_BUCKET}/${KEY}"
            exit 0
          fi
          aws s3 rm "s3://${IMPORT_DUMP_BUCKET}/${KEY}" || true

      - name: Report skipped import run
        if: ${{ steps.config.outputs.should_run != 'true' }}
        run: |
          {
            echo "## Legacy CRM import skipped"
            echo ""
            echo "Required production environment variables are not configured."
            echo "Set AWS_ACCOUNT_ID and AWS_REGION."
          } >> "${GITHUB_STEP_SUMMARY}"
