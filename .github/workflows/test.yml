name: Test

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-python:
    name: Test Python
    runs-on: ubuntu-26.04
    # template:optional database
    services:
      postgres:
        image: postgres:16@sha256:72d22ce26d04fe56a5384e9f6b026152d1cf05db602a7a3524a3ed337d5f5752 # linux/amd64 2026-11-22
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # template:end
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24

      - name: Run Python tests
        run: bash scripts/ci/test-python.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore
  test-admin-web:
    name: Test Admin Web
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/admin_web

      - name: Run tests
        run: npm run test:ci
        working-directory: apps/admin_web
        # template:set
        env:
          NEXT_PUBLIC_COGNITO_DOMAIN: auth.example.com
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder-client-id
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: placeholder-pool
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.example.com
        # template:end

      - name: Build
        run: npm run build
        working-directory: apps/admin_web
        # template:set
        env:
          NEXT_PUBLIC_COGNITO_DOMAIN: auth.example.com
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder-client-id
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: placeholder-pool
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.example.com
        # template:end

  test-public-www:
    name: Test Public Website
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      # template:optional public-build-env
      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh

      # template:end
      - name: Run tests
        run: npm run test:ci
        working-directory: apps/public_www
        # template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_FOUNDER_NAME: ${{ vars.NEXT_PUBLIC_FOUNDER_NAME }}
        # template:end

      - name: Build
        run: npm run build
        working-directory: apps/public_www
        # template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_public_site_config.outputs.production_site_origin }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FPS_MERCHANT_NAME: ${{ vars.NEXT_PUBLIC_FPS_MERCHANT_NAME }}
          NEXT_PUBLIC_FPS_MOBILE_NUMBER: ${{ vars.NEXT_PUBLIC_FPS_MOBILE_NUMBER }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS: ${{ vars.NEXT_PUBLIC_WWW_PROXY_ALLOWED_HOSTS }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_WHATSAPP_URL: ${{ vars.NEXT_PUBLIC_WHATSAPP_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_LINKEDIN_URL: ${{ vars.NEXT_PUBLIC_LINKEDIN_URL }}
          NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ vars.NEXT_PUBLIC_BUSINESS_ADDRESS }}
          NEXT_PUBLIC_BUSINESS_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_NUMBER }}
          NEXT_PUBLIC_FOUNDER_NAME: ${{ vars.NEXT_PUBLIC_FOUNDER_NAME }}
        # template:end

  # template:optional training
  test-training:
    name: Test Training
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve training site env from infrastructure params
        id: resolve_training_site_env
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          params = json.loads(Path("backend/infrastructure/params/production.json").read_text(encoding="utf-8"))
          site = str(params.get("TrainingDomainName", "")).strip()
          public = str(params.get("PublicWwwDomainName", "")).strip()
          if not site or not public:
              raise SystemExit("TrainingDomainName and PublicWwwDomainName are required")
          print(f"site_origin=https://{site}")
          print(f"public_www_origin=https://{public}")
          PY

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/training

      - name: Run tests
        run: npm run test:ci
        working-directory: apps/training
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_training_site_env.outputs.site_origin }}
          NEXT_PUBLIC_PUBLIC_WWW_ORIGIN: ${{ steps.resolve_training_site_env.outputs.public_www_origin }}
          NEXT_PUBLIC_API_BASE_URL: /www
          NEXT_PUBLIC_TRAINING_API_KEY: test-training-poll-api-key

      - name: Build
        run: npm run build
        working-directory: apps/training
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.resolve_training_site_env.outputs.site_origin }}
          NEXT_PUBLIC_PUBLIC_WWW_ORIGIN: ${{ steps.resolve_training_site_env.outputs.public_www_origin }}
          NEXT_PUBLIC_API_BASE_URL: /www
          NEXT_PUBLIC_TRAINING_API_KEY: test-training-poll-api-key

  # template:end
  test-infrastructure:
    name: Test infrastructure
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          cache: npm
          working-directory: backend/infrastructure

      - name: Set up Python
        uses: lx-software-ltd/actions/setup-python@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24

      - name: Run infrastructure tests
        run: npm run test:infra
        working-directory: backend/infrastructure

  # template:optional playwright-public
  e2e-public-www:
    name: Test Public Website E2E
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/public_www
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Install Playwright browsers
        uses: lx-software-ltd/actions/playwright-install@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          working-directory: apps/public_www

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: public-www-test-results
          path: apps/public_www/test-results/
          retention-days: 7

  # template:end
  # template:optional mobile
  test-flutter:
    name: Test Flutter
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: lx-software-ltd/actions/setup-flutter@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24

      - name: Run Flutter tests
        run: bash scripts/ci/test-flutter.sh


  build-android:
    name: Build Android
    runs-on: ubuntu-26.04
    env:
      # Maven Central returns 429 from shared CI egress. Gradle retries that
      # status and doubles this delay between attempts (5s, 10s, 20s, 40s).
      GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=5 -Dorg.gradle.internal.repository.initial.backoff=5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # template:set
          java-version: "21"
          # template:end

      - name: Set up Flutter
        uses: lx-software-ltd/actions/setup-flutter@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24

      - name: Point Flutter at Java 21
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Build debug APK
        # template:set
        working-directory: apps/evolvesprouts_app
        # template:end
        run: flutter build apk --debug

  # template:end
  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      # template:set
      - test-python
      - test-admin-web
      - test-public-www
      - test-training
      - test-infrastructure
      - e2e-public-www
      - test-flutter
      - build-android
    # template:end
    if: always()
    steps:
      - name: Require every test job
        uses: lx-software-ltd/actions/require-jobs@2c0ccd2fdf6d2ab7cec932bcebc33f05d24bdd1a # main 2026-11-24
        with:
          needs-json: ${{ toJson(needs) }}
