name: Deploy iOS

on:
  repository_dispatch:
    types: [deploy-ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-26
    environment: production
    env:
      MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: lx-software-ltd/actions/setup-flutter@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          channel: "stable"
          flutter-version: "3.50.1"
          cache: "true"

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/evolvesprouts_app

      - name: Setup SSH for certificates repo
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: ${{ env.MATCH_DEPLOY_KEY != '' }}
        with:
          ssh-private-key: ${{ env.MATCH_DEPLOY_KEY }}

      - name: Sync signing assets (match)
        working-directory: apps/evolvesprouts_app/ios
        run: |
          if [ -z "$MATCH_GIT_URL" ] || [ -z "$MATCH_PASSWORD" ] || [ -z "$FASTLANE_USER" ] || [ -z "$FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD" ]; then
            echo "Skipping fastlane match (missing secrets)"
            exit 0
          fi
          fastlane match appstore --readonly
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          MATCH_APP_IDENTIFIER: ${{ vars.IOS_BUNDLE_ID || 'com.evolvesprouts' }}
          MATCH_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          FASTLANE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Generate ExportOptions.plist
        uses: lx-software-ltd/actions/ios-export-options@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          working-directory: apps/evolvesprouts_app
          team-id: ${{ vars.APPLE_TEAM_ID }}
          bundle-id: ${{ vars.IOS_BUNDLE_ID || 'com.evolvesprouts' }}
          provisioning-profile: ${{ vars.IOS_PROVISIONING_PROFILE }}

      - name: Build release IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --dart-define=AMPLIFY_API_KEY=${{ secrets.AMPLIFY_API_KEY }} \
            --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ vars.FIREBASE_IOS_APP_ID }} \
            --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ vars.IOS_BUNDLE_ID || 'com.evolvesprouts' }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_APP_CHECK_DEBUG=${{ vars.FIREBASE_APP_CHECK_DEBUG }}
        working-directory: apps/evolvesprouts_app

      - name: Load App Store Connect API key
        uses: lx-software-ltd/actions/appstore-api-key@f68a62d345907c7da3a929e12e5a2ded28af3514 # main 2026-11-24
        with:
          api-key-json: ${{ secrets.APPSTORE_API_KEY_JSON }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload to TestFlight
        if: env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_API_KEY_ID != '' && env.APPSTORE_API_PRIVATE_KEY != ''
        uses: apple-actions/upload-testflight-build@665328adbecbc3ad929d3da710696d928b8a7ba9 # v5.9.0
        with:
          app-path: apps/evolvesprouts_app/build/ios/ipa/*.ipa
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_API_PRIVATE_KEY }}
