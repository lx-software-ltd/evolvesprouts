name: Lint

on:
  repository_dispatch:
    types: [lint]
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "backend/**"
      - "shared/**"
      - "tests/**"
      - "docs/api/**"
      - "docs/architecture/**"
      - ".cursorrules"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - "scripts/validate-cursorrules.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "backend/**"
      - "shared/**"
      - "tests/**"
      - "docs/api/**"
      - "docs/architecture/**"
      - ".cursorrules"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - "scripts/validate-cursorrules.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/lint.yml"

jobs:
  enforce-cursorrules:
    name: Enforce Cursor Rules Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate .cursorrules contract
        run: bash scripts/validate-cursorrules.sh

  lint-dart:
    name: Lint Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Run Dart/Flutter lint
        run: |
          set -e
          for dir in apps/evolvesprouts_app packages/flutter_ui packages/api_client_dart; do
            if [ -d "$dir" ]; then
              echo "Linting Dart in $dir"
              (cd "$dir" && flutter pub get && flutter analyze)
            else
              echo "Skipping missing $dir"
            fi
          done

  lint-react:
    name: Lint React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"

      - name: Run React lint
        run: |
          set -euo pipefail

          # Retry only npm-registry audit outages (HTTP 503). Real high-severity
          # findings still fail immediately.
          run_npm_audit() {
            local dir="$1"
            local attempt=1
            local max_attempts=4
            local delay=8
            local audit_output
            local audit_status

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "npm audit (attempt ${attempt}/${max_attempts}) in ${dir}"
              set +e
              audit_output="$(cd "$dir" && npm audit --omit=dev --audit-level=high 2>&1)"
              audit_status=$?
              set -e
              printf '%s\n' "$audit_output"
              if [ "$audit_status" -eq 0 ]; then
                return 0
              fi
              if printf '%s' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error'; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  echo "npm audit registry unavailable; retrying in ${delay}s..."
                  sleep "$delay"
                  delay=$((delay * 2))
                  attempt=$((attempt + 1))
                  continue
                fi
              fi
              return "$audit_status"
            done
          }

          for dir in apps/admin_web apps/public_www apps/training; do
            if [ -f "$dir/package.json" ]; then
              echo "Linting React in $dir"
              if [ -f "$dir/package-lock.json" ]; then
                (cd "$dir" && npm ci)
              else
                (cd "$dir" && npm install)
              fi
              (cd "$dir" && npm run lint --if-present)
              if [ "$dir" = "apps/admin_web" ] || [ "$dir" = "apps/training" ]; then
                run_npm_audit "$dir"
              fi
            else
              echo "Skipping missing $dir"
            fi
          done

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Avoid depending on pull_request merge refs which can intermittently fail to fetch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Install CDK dependencies for pre-commit
        working-directory: backend/infrastructure
        run: npm ci

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  lint-cdk:
    name: Lint CDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: backend/infrastructure/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CDK dependencies
        working-directory: backend/infrastructure
        run: npm ci

      - name: Acknowledge CDK CLI notice
        working-directory: backend/infrastructure
        run: npx cdk acknowledge 34892 || true

      - name: Run CDK lint
        working-directory: backend/infrastructure
        run: npm run lint --if-present

      - name: Synthesize CDK
        working-directory: backend/infrastructure
        env:
          CDK_DISABLE_CONTEXT_LOOKUPS: "1"
        run: npx cdk synth --quiet --output cdk.out

      - name: Check CDK routes match admin OpenAPI spec
        run: node scripts/check-cdk-admin-api-routes.mjs

  lint-openapi:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint OpenAPI specs
        run: npx --yes @redocly/cli@1.34.11 lint docs/api/admin.yaml docs/api/public.yaml
