name: Smoke Public Website Staging

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Smoke check scope'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pages
          - api
      max_pages:
        description: 'Optional max number of pages to check'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-public-www-staging
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config
        id: resolve_public_site_config
        run: bash scripts/deploy/resolve-public-www-build-env.sh
        env:
          REQUIRE_ASSET: "false"

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@d7a2f0cacbb986d620aa9c34acc7026d1e04970c # main 2026-11-26
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run staging smoke checks
        working-directory: apps/public_www
# template:set
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          STAGING_BYPASS_SECRET: ${{ secrets.STAGING_BYPASS_SECRET }}
          SMOKE_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          SMOKE_CRM_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SMOKE_MEDIA_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SMOKE_SCOPE: ${{ github.event.inputs.scope || 'all' }}
          SMOKE_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          SMOKE_BASE_URL: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
# template:end
        run: npm run smoke:staging

      - name: Publish smoke summary
        if: always()
        run: bash scripts/deploy/publish-staging-summary.sh smoke
        env:
          SUMMARY_TARGET_URL: ${{ steps.resolve_public_site_config.outputs.staging_site_origin }}
          SUMMARY_SCOPE: ${{ github.event.inputs.scope || 'all' }}
          SUMMARY_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
