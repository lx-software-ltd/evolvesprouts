name: Smoke Public Website Staging

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Smoke check scope'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pages
          - api
      max_pages:
        description: 'Optional max number of pages to check'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-public-www-staging
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve public site build config from infrastructure params
        id: resolve_staging_site_origin
        env:
          REQUIRE_ASSET: "false"
        run: bash scripts/deploy/resolve-public-www-build-env.sh

      - name: Set up Node.js
        uses: lx-software-ltd/actions/setup-node@8b75c2c3e18a96ffae1ac4f99e3dceb4821a1faf # main 2026-11-24
        with:
          cache: npm
          working-directory: apps/public_www

      - name: Run staging smoke checks
        working-directory: apps/public_www
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SMOKE_BASE_URL: ${{ steps.resolve_staging_site_origin.outputs.staging_site_origin }}
          STAGING_BYPASS_SECRET: ${{ secrets.STAGING_BYPASS_SECRET }}
          SMOKE_API_KEY: ${{ secrets.NEXT_PUBLIC_WWW_CRM_API_KEY }}
          SMOKE_CRM_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SMOKE_MEDIA_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SMOKE_SCOPE: ${{ github.event.inputs.scope || 'all' }}
          SMOKE_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
        run: npm run smoke:staging

      - name: Publish smoke summary
        if: always()
        env:
          SUMMARY_TARGET_URL: ${{ steps.resolve_staging_site_origin.outputs.staging_site_origin }}
          SUMMARY_SCOPE: ${{ github.event.inputs.scope || 'all' }}
          SUMMARY_MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
        run: |
          {
            echo '## Public Website staging smoke test'
            echo ''
            echo "- Target URL: \`${SUMMARY_TARGET_URL}\`"
            echo "- Trigger: \`workflow_dispatch\`"
            echo "- Scope: \`${SUMMARY_SCOPE}\`"
            if [ -n "${SUMMARY_MAX_PAGES}" ]; then
              echo "- Max pages: \`${SUMMARY_MAX_PAGES}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
