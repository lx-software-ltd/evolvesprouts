name: Verify GitHub Rulesets

on:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"
  repository_dispatch:
    types: [verify-rulesets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-branch-protection:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify rulesets
        uses: lx-software-ltd/actions/verify-rulesets@aab84b76383d5a44838f9617ac47b23cfff7fdaf # main 2026-11-20
        with:
          token: ${{ github.token }}
          expected-reviews: "0"
          required-checks: lint test

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "GitHub Rulesets Verification Complete"
          echo "========================================"
          echo ""
          echo "For setup instructions, see:"
          echo "  docs/architecture/github-rulesets.md"
          echo ""
          echo "To configure via GitHub UI:"
          echo "  Settings → Rules → Rulesets"
