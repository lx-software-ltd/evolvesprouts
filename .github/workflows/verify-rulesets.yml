name: Verify GitHub Rulesets

on:
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"
  repository_dispatch:
    types: [verify-rulesets]
  workflow_dispatch:

permissions:
  contents: read
  administration: read

jobs:
  verify-branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify branch and tag rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/verify_github_rulesets.py

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "GitHub Rulesets Verification Complete"
          echo "========================================"
          echo ""
          echo "For setup instructions, see:"
          echo "  docs/architecture/github-rulesets.md"
          echo ""
          echo "To configure via GitHub UI:"
          echo "  Settings → Rules → Rulesets"
